schema_version = 1

# Contract-sensitive production surfaces. When a pull request changes one of
# these paths it must also change the normative documentation listed for the
# rule. Keep this registry narrow: it protects architectural/operational
# contracts, not every implementation detail or historical construction input.

[[rules]]
id = "worker-runtime"
description = "Durable worker execution, fencing, process assembly, and worker/domain credential boundaries"
triggers = [
  "src/request_engine/platform/worker/**",
  "src/request_engine/platform/scheduling/**",
  "src/request_engine/platform/outbox/**",
  "src/request_engine/platform/events/provider_events.py",
  "src/request_engine/bootstrap/worker.py",
  "src/request_engine/entrypoints/worker/**",
]
required_docs = ["docs/v3/10-worker-runtime-hardening.md"]
required_docs_mode = "all"

[[rules]]
id = "cross-tenant-shared-capacity"
description = "Cross-tenant shared-capacity identity, authority, serialization, privacy, and booking integration"
triggers = [
  "src/request_engine/modules/booking/adapters/db/reservation_commands.py",
  "src/request_engine/modules/booking/adapters/db/commitment_commands.py",
  "src/request_engine/modules/booking/adapters/db/slot_offer_capacity.py",
  "src/request_engine/modules/booking/adapters/db/capacity_errors.py",
  "src/request_engine/modules/booking/adapters/db/capacity_error_boundary.py",
  "src/request_engine/modules/booking/api/__init__.py",
  "src/request_engine/modules/booking/api/errors.py",
  "src/request_engine/bootstrap/http.py",
  "tests/db/test_v3_cross_tenant_*.py",
  "tests/integration/v3_booking_commitments/test_cross_tenant_shared_capacity*.py",
  "tests/unit/test_booking_unavailability_privacy.py",
]
required_docs = ["docs/v3/12-cross-tenant-shared-capacity-design.md"]
required_docs_mode = "all"

[[rules]]
id = "instance-claim-trust-root"
description = "Instance claim, SetupSession, WebAuthn, authentication assurance and Platform Owner trust-root semantics"
triggers = [
  "migrations/versions/0057_platform_instance_setup.py",
  "migrations/versions/00*instance_claim*.py",
  "migrations/versions/00*platform_owner*.py",
  "migrations/versions/00*webauthn*.py",
  "migrations/versions/00*recovery_code*.py",
  "src/request_engine/modules/tenancy/**/instance_claim*.py",
  "src/request_engine/modules/tenancy/**/platform_owner*.py",
  "src/request_engine/modules/tenancy/**/setup_*.py",
  "src/request_engine/platform/security/*webauthn*.py",
  "src/request_engine/platform/security/*setup*.py",
  "src/request_engine/platform/security/assurance*.py",
  "src/request_engine/platform/security/recovery_code*.py",
  "src/request_engine/platform/db/*webauthn*.py",
  "src/request_engine/platform/db/*setup*.py",
  "src/request_engine/platform/db/recovery_code*.py",
  "src/request_engine/entrypoints/http/*setup*.py",
  "deploy/reference/e2e-runner-requirements.txt",
  "deploy/reference/e2e-runner.Dockerfile",
  "tests/db/test_platform_instance_setup.py",
  "tests/db/test_instance_claim*.py",
  "tests/db/test_webauthn*.py",
  "tests/db/test_setup*.py",
  "tests/e2e/test_instance_setup*.py",
  "tests/system_e2e/**/instance_claim*",
]
required_docs = ["docs/architecture/instance-claim-platform-owner-plan.md"]
required_docs_mode = "all"


[[rules]]
id = "platform-configuration-secrets-recovery"
description = "Self-hosted platform secret storage, OpenBao deployment and offline administrative recovery"
triggers = [
  "migrations/versions/0068_offline_password_reset.py",
  "migrations/versions/0069_platform_configuration*.py",
  "src/request_engine/platform/secrets/platform_store.py",
  "src/request_engine/platform/secrets/openbao_*.py",
  "src/request_engine/bootstrap/recovery_delivery.py",
  "src/request_engine/platform/security/recovery_code*.py",
  "src/request_engine/platform/db/recovery_code*.py",
  "src/request_engine/entrypoints/http/native_auth.py",
  "deploy/openbao/**",
  "deploy/reference/compose.e2e.yaml",
  "tests/unit/platform/secrets/test_openbao*.py",
  "tests/db/test_recovery_code_persistence.py",
  "tests/e2e/test_instance_setup_http.py",
]
required_docs = [
  "docs/adr/0015-platform-configuration-secrets-recovery.md",
  "docs/architecture/platform-configuration-secrets-recovery-plan.md",
]
required_docs_mode = "all"
