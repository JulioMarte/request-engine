schema_version = 1
status = "normative-current-guarantee-inventory"
policy = "docs/architecture/pre-production-evolution-policy.md"

# This file inventories guarantees, never exact test filenames. Test-to-guarantee
# coverage is discovered from test evidence/metadata and may evolve without turning
# this inventory into another repository-shape snapshot.

[[guarantees]]
id = "INV-TENANT-001"
statement = "A tenant cannot observe or mutate another tenant's private rows through supported runtime surfaces, and foreign identifiers remain opaque where privacy requires it."
severity = "critical"
required_evidence = ["invariant", "adversarial"]
risk = ["security"]

[[guarantees]]
id = "INV-AUTHORITY-001"
statement = "Every state-changing or party-scoped operation is authorized by explicit actor/representation authority and cannot gain authority from caller-supplied identifiers."
severity = "critical"
required_evidence = ["invariant", "adversarial"]
risk = ["security"]

[[guarantees]]
id = "INV-ATOMICITY-001"
statement = "A failed transactional command cannot leave a partially committed business outcome or partially consumed commitment."
severity = "critical"
required_evidence = ["invariant", "adversarial"]
risk = []

[[guarantees]]
id = "INV-CAPACITY-001"
statement = "Authoritative committed capacity has one ownership/ledger model and contested operations cannot oversell or create split ownership."
severity = "critical"
required_evidence = ["invariant", "adversarial", "concurrency"]
risk = ["capacity"]

[[guarantees]]
id = "INV-IDEMPOTENCY-001"
statement = "Externally retryable state-changing commands are idempotent within their defined scope and reject conflicting reuse without duplicating effects."
severity = "critical"
required_evidence = ["invariant", "adversarial"]
risk = []

[[guarantees]]
id = "INV-PROVENANCE-001"
statement = "Committed historical facts required to explain a business outcome remain reconstructable after mutable configuration or resource state changes."
severity = "critical"
required_evidence = ["invariant", "adversarial"]
risk = ["provenance"]

[[guarantees]]
id = "INV-WORKER-001"
statement = "Durable worker processing is safe under crash, retry, duplicate delivery, lease expiry and late/out-of-order execution according to each work family's contract."
severity = "critical"
required_evidence = ["invariant", "adversarial", "concurrency"]
risk = ["provenance"]

[[guarantees]]
id = "INV-OUTBOX-001"
statement = "Committed business consequences that cross an asynchronous boundary are durably represented and can be retried/reconciled without silent loss or duplicate authoritative effects."
severity = "critical"
required_evidence = ["invariant", "adversarial"]
risk = ["provenance"]

[[guarantees]]
id = "INV-PRIVILEGE-001"
statement = "Runtime database roles and security-definer surfaces retain least privilege, tenant isolation and explicit callable/write authority."
severity = "critical"
required_evidence = ["invariant", "adversarial"]
risk = ["security"]

[[guarantees]]
id = "INV-TEMPORAL-001"
statement = "Time-based availability and commitments preserve half-open interval, timezone and DST semantics without ambiguous or duplicated ownership."
severity = "critical"
required_evidence = ["invariant", "adversarial"]
risk = ["temporal", "capacity"]

[[guarantees]]
id = "INV-DISCOVERY-PUBLICATION-001"
statement = "Cross-tenant discovery exposes supply only through an explicit active mapping plus effective publication and emits only the approved public Organization, Location, Offering and optional provider projection; tenant existence and private/shared identities never imply discoverability."
severity = "critical"
required_evidence = ["invariant", "contract", "adversarial"]
risk = ["security"]

[[guarantees]]
id = "INV-DISCOVERY-HANDOFF-001"
statement = "A discovery option is an opaque advisory handoff: Booking revalidates publication, mapping, current OfferingVersion and F1 schedule/terms/assignment/capacity in the authoritative transaction; stale or consumed-new-mutation attempts leave no second commitment."
severity = "critical"
required_evidence = ["invariant", "contract", "adversarial"]
risk = ["security", "capacity", "provenance", "temporal"]

[[guarantees]]
id = "INV-DISCOVERY-CONCURRENCY-001"
statement = "Contested discovery configuration converges to coherent durable state: conflicting publication scopes and concurrent first mappings serialize to one valid active authority state with deterministic loser semantics and no partial effects."
severity = "critical"
required_evidence = ["invariant", "adversarial", "concurrency"]
risk = ["security", "provenance"]

[[guarantees]]
id = "INV-LIVE-OPS-SEPARATION-001"
statement = "Reservation planning, QueueEntry waiting/calling state and ServiceSession execution remain independent historical facts throughout the integrated live-service journey; actual execution cannot rewrite booking planning or capacity provenance."
severity = "critical"
required_evidence = ["invariant", "contract", "adversarial"]
risk = ["provenance"]

[[guarantees]]
id = "INV-LIVE-OPS-LIFECYCLE-001"
statement = "A real Reservation can traverse CheckIn, FIFO/CallNext, service start, interruption/resume and completion through supported operations while QueueEntry and ServiceSession transitions remain transactionally coherent; committed serving/completed execution cannot exist on only one side of the Queue-to-Delivery boundary."
severity = "critical"
required_evidence = ["invariant", "adversarial", "concurrency"]
risk = ["provenance"]

[[guarantees]]
id = "INV-LIVE-OPS-TEMPORAL-001"
statement = "Arrival, admission, calling, service, interruption and completion timestamps are database-authoritative, durable and ordered according to the accepted live-operation lifecycle."
severity = "critical"
required_evidence = ["invariant", "adversarial"]
risk = ["temporal", "provenance"]

[[guarantees]]
id = "INV-LIVE-OPS-PRIVACY-001"
statement = "Customer queue projections expose only the authorized subject's safe queue state; the staff live projection contains only active operational states, and terminal history is separately authorized and bounded so neither surface becomes an unbounded or cross-tenant disclosure channel."
severity = "critical"
required_evidence = ["invariant", "contract", "adversarial"]
risk = ["security"]

[[guarantees]]
id = "INV-LIVE-OPS-CLASSIFICATION-001"
statement = "Tenant-defined operational workload vocabulary is provisionable through revisioned, idempotent, append-preserving lifecycle commands; expected workload and actual observed workload remain independently reconstructable without mutating OfferingVersion or Reservation planning truth."
severity = "critical"
required_evidence = ["invariant", "contract", "adversarial"]
risk = ["provenance"]

[[guarantees]]
id = "INV-LIVE-OPS-RESOURCE-001"
statement = "Actual service and non-patient ResourceActivity obey the accepted live-resource serialization policy so contested operations cannot create overlapping authoritative occupation."
severity = "critical"
required_evidence = ["invariant", "adversarial", "concurrency"]
risk = ["capacity", "provenance"]

[[guarantees]]
id = "INV-LIVE-CAPACITY-SEPARATION-001"
statement = "Booking scheduled planning/commitment truth remains distinct from F4 live intake projection: live deterioration cannot rewrite Reservation, CapacityClaim or schedule truth, and scheduled headroom and live intake headroom remain separately observable."
severity = "critical"
required_evidence = ["invariant", "contract", "adversarial"]
risk = ["capacity", "provenance"]

[[guarantees]]
id = "INV-LIVE-CAPACITY-PROJECTION-001"
statement = "F4 projections and intake evaluations are read-only advisory derivations from published authoritative Booking, Queue and Delivery facts and cannot create, release or mutate authoritative commitments, queue/execution facts or projection policy merely by being read."
severity = "critical"
required_evidence = ["invariant", "contract", "adversarial"]
risk = ["capacity", "provenance"]

[[guarantees]]
id = "INV-LIVE-CAPACITY-WORKLOAD-001"
statement = "Workload identity, expected workload, actual workload, configured estimate policy, completed historical observations and the selected projection estimate/provenance remain distinguishable; estimator history never mutates policy and fallback order remains resource history, tenant history, configured policy, applicable planned duration, then unknown."
severity = "critical"
required_evidence = ["invariant", "contract", "adversarial"]
risk = ["provenance"]

[[guarantees]]
id = "INV-LIVE-CAPACITY-TEMPORAL-001"
statement = "Each F4 projection uses one PostgreSQL-sourced observation instant and coherent read snapshot, projects only over effective possibly-discontinuous remaining operational intervals, and exposes open-ended interruption or resource occupation as uncertainty instead of fabricated temporal precision."
severity = "critical"
required_evidence = ["invariant", "contract", "adversarial"]
risk = ["temporal", "capacity"]

[[guarantees]]
id = "INV-LIVE-CAPACITY-DEDUP-001"
statement = "One real service contributes remaining workload at most once across Reservation, QueueEntry and ServiceSession representations; the live representation wins while a matching Reservation planned duration may survive only as estimate fallback provenance, never as a second work item."
severity = "critical"
required_evidence = ["invariant", "contract", "adversarial"]
risk = ["capacity", "provenance"]

[[guarantees]]
id = "INV-LIVE-CAPACITY-PRIVACY-001"
statement = "F4 staff, customer and cross-tenant projection surfaces remain least-privilege: tenant identifiers do not grant access, and customer projection exposes only approved self-relative status without other customers' identities, workloads, operational causes or historical samples."
severity = "critical"
required_evidence = ["invariant", "contract", "adversarial"]
risk = ["security"]

[[guarantees]]
id = "FIT-ARCH-001"
statement = "Current module ownership remains explicit, dependency direction remains understandable and acyclic, and cross-module imports use published connection surfaces rather than internals."
severity = "critical"
required_evidence = ["fitness"]
risk = []

[[guarantees]]
id = "FIT-TYPE-BOUNDARY-001"
statement = "Business semantic layers, cross-module contracts, persistence mappings and HTTP/provider DTOs remain distinct type boundaries; transport technology and transport/persistence naming cannot silently leak inward."
severity = "critical"
required_evidence = ["fitness"]
risk = []

[[guarantees]]
id = "FIT-REPO-GOV-001"
statement = "Repository documentation and LLM instruction routing preserve one discoverable source-of-truth hierarchy, explicit path-local rules and semantic naming/ownership conventions without turning incidental repository shape into immutable snapshots."
severity = "critical"
required_evidence = ["fitness"]
risk = []

[[guarantees]]
id = "INV-FAILURE-001"
statement = "Rejected or failed public/runtime operations expose bounded, reproducible failure semantics without leaking private state or converting semantic rejection into unsafe retry loops."
severity = "high"
required_evidence = ["contract", "adversarial"]
risk = ["security"]
