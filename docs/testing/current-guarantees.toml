schema_version = 1
status = "normative-current-guarantee-inventory"
policy = "docs/architecture/pre-production-evolution-policy.md"

# This file inventories guarantees, never exact test filenames. Test-to-guarantee
# coverage is discovered from test evidence/metadata and may evolve without turning
# this inventory into another repository-shape snapshot.

[[guarantees]]
id = "INV-TENANT-001"
statement = "A tenant cannot observe or mutate another tenant's private rows through supported runtime surfaces, and foreign identifiers remain opaque where privacy requires it."
severity = "critical"
required_evidence = ["invariant", "adversarial"]
risk = ["security"]

[[guarantees]]
id = "INV-AUTHORITY-001"
statement = "Every state-changing or party-scoped operation is authorized by explicit actor/representation authority and cannot gain authority from caller-supplied identifiers."
severity = "critical"
required_evidence = ["invariant", "adversarial"]
risk = ["security"]

[[guarantees]]
id = "INV-CONTROLLER-CONTINUITY-001"
statement = "A tenant or platform plane cannot lose every effective controller: a controller needs an active Principal, an active membership where the plane is tenant, the current control grants and at least one active binding to an active authority, with an active native identity and at least one currently accepted authentication path where the subject is native. Password credentials are one supported path, not the architectural definition of native reachability."
severity = "critical"
required_evidence = ["invariant", "adversarial"]
risk = ["security"]

[[guarantees]]
id = "INV-PLATFORM-LIFECYCLE-001"
statement = "Platform provisioner lifecycle transitions are revisioned, idempotent, append-only audited and terminal on revoke; reactivation requires an authenticatable native path and never restores revoked authority."
severity = "critical"
required_evidence = ["invariant", "adversarial"]
risk = ["security"]

[[guarantees]]
id = "INV-ATOMICITY-001"
statement = "A failed transactional command cannot leave a partially committed business outcome or partially consumed commitment."
severity = "critical"
required_evidence = ["invariant", "adversarial"]
risk = []

[[guarantees]]
id = "INV-CAPACITY-001"
statement = "Authoritative committed capacity has one ownership/ledger model and contested operations cannot oversell or create split ownership."
severity = "critical"
required_evidence = ["invariant", "adversarial", "concurrency"]
risk = ["capacity"]

[[guarantees]]
id = "INV-IDEMPOTENCY-001"
statement = "Externally retryable state-changing commands are idempotent within their defined scope and reject conflicting reuse without duplicating effects."
severity = "critical"
required_evidence = ["invariant", "adversarial"]
risk = []

[[guarantees]]
id = "INV-PROVENANCE-001"
statement = "Committed historical facts required to explain a business outcome remain reconstructable after mutable configuration or resource state changes."
severity = "critical"
required_evidence = ["invariant", "adversarial"]
risk = ["provenance"]

[[guarantees]]
id = "INV-WORKER-001"
statement = "Durable worker processing is safe under crash, retry, duplicate delivery, lease expiry and late/out-of-order execution according to each work family's contract."
severity = "critical"
required_evidence = ["invariant", "adversarial", "concurrency"]
risk = ["provenance"]

[[guarantees]]
id = "INV-OUTBOX-001"
statement = "Committed business consequences that cross an asynchronous boundary are durably represented and can be retried/reconciled without silent loss or duplicate authoritative effects."
severity = "critical"
required_evidence = ["invariant", "adversarial"]
risk = ["provenance"]

[[guarantees]]
id = "INV-PRIVILEGE-001"
statement = "Runtime database roles and security-definer surfaces retain least privilege, tenant isolation and explicit callable/write authority."
severity = "critical"
required_evidence = ["invariant", "adversarial"]
risk = ["security"]

[[guarantees]]
id = "INV-TEMPORAL-001"
statement = "Time-based availability and commitments preserve half-open interval, timezone and DST semantics without ambiguous or duplicated ownership."
severity = "critical"
required_evidence = ["invariant", "adversarial"]
risk = ["temporal", "capacity"]

[[guarantees]]
id = "INV-DISCOVERY-PUBLICATION-001"
statement = "Cross-tenant discovery exposes supply only through an explicit active mapping plus effective publication and emits only the approved public Organization, Location, Offering and optional provider projection; tenant existence and private/shared identities never imply discoverability."
severity = "critical"
required_evidence = ["invariant", "contract", "adversarial"]
risk = ["security"]

[[guarantees]]
id = "INV-DISCOVERY-HANDOFF-001"
statement = "A discovery option is an opaque advisory handoff: Booking revalidates publication, mapping, current OfferingVersion and F1 schedule/terms/assignment/capacity in the authoritative transaction; stale or consumed-new-mutation attempts leave no second commitment."
severity = "critical"
required_evidence = ["invariant", "contract", "adversarial"]
risk = ["security", "capacity", "provenance", "temporal"]

[[guarantees]]
id = "INV-DISCOVERY-CONCURRENCY-001"
statement = "Contested discovery configuration converges to coherent durable state: conflicting publication scopes and concurrent first mappings serialize to one valid active authority state with deterministic loser semantics and no partial effects."
severity = "critical"
required_evidence = ["invariant", "adversarial", "concurrency"]
risk = ["security", "provenance"]

[[guarantees]]
id = "INV-LIVE-OPS-SEPARATION-001"
statement = "Reservation planning, QueueEntry waiting/calling state and ServiceSession execution remain independent historical facts throughout the integrated live-service journey; actual execution cannot rewrite booking planning or capacity provenance."
severity = "critical"
required_evidence = ["invariant", "contract", "adversarial"]
risk = ["provenance"]

[[guarantees]]
id = "INV-LIVE-OPS-LIFECYCLE-001"
statement = "A real Reservation can traverse CheckIn, FIFO/CallNext, service start, interruption/resume and completion through supported operations while QueueEntry and ServiceSession transitions remain transactionally coherent; committed serving/completed execution cannot exist on only one side of the Queue-to-Delivery boundary."
severity = "critical"
required_evidence = ["invariant", "adversarial", "concurrency"]
risk = ["provenance"]

[[guarantees]]
id = "INV-LIVE-OPS-TEMPORAL-001"
statement = "Arrival, admission, calling, service, interruption and completion timestamps are database-authoritative, durable and ordered according to the accepted live-operation lifecycle."
severity = "critical"
required_evidence = ["invariant", "adversarial"]
risk = ["temporal", "provenance"]

[[guarantees]]
id = "INV-LIVE-OPS-PRIVACY-001"
statement = "Customer queue projections expose only the authorized subject's safe queue state; the staff live projection contains only active operational states, and terminal history is separately authorized and bounded so neither surface becomes an unbounded or cross-tenant disclosure channel."
severity = "critical"
required_evidence = ["invariant", "contract", "adversarial"]
risk = ["security"]

[[guarantees]]
id = "INV-LIVE-OPS-CLASSIFICATION-001"
statement = "Tenant-defined operational workload vocabulary is provisionable through revisioned, idempotent, append-preserving lifecycle commands; expected workload and actual observed workload remain independently reconstructable without mutating OfferingVersion or Reservation planning truth."
severity = "critical"
required_evidence = ["invariant", "contract", "adversarial"]
risk = ["provenance"]

[[guarantees]]
id = "INV-LIVE-OPS-RESOURCE-001"
statement = "Actual service and non-patient ResourceActivity obey the accepted live-resource serialization policy so contested operations cannot create overlapping authoritative occupation."
severity = "critical"
required_evidence = ["invariant", "adversarial", "concurrency"]
risk = ["capacity", "provenance"]

[[guarantees]]
id = "INV-LIVE-CAPACITY-SEPARATION-001"
statement = "Booking scheduled planning/commitment truth remains distinct from F4 live intake projection: live deterioration cannot rewrite Reservation, CapacityClaim or schedule truth, and scheduled headroom and live intake headroom remain separately observable."
severity = "critical"
required_evidence = ["invariant", "contract", "adversarial"]
risk = ["capacity", "provenance"]

[[guarantees]]
id = "INV-LIVE-CAPACITY-PROJECTION-001"
statement = "F4 projections and intake evaluations are read-only advisory derivations from published authoritative Booking, Queue and Delivery facts and cannot create, release or mutate authoritative commitments, queue/execution facts or projection policy merely by being read."
severity = "critical"
required_evidence = ["invariant", "contract", "adversarial"]
risk = ["capacity", "provenance"]

[[guarantees]]
id = "INV-LIVE-CAPACITY-WORKLOAD-001"
statement = "Workload identity, expected workload, actual workload, configured estimate policy, completed historical observations and the selected projection estimate/provenance remain distinguishable; estimator history never mutates policy and fallback order remains resource history, tenant history, configured policy, applicable planned duration, then unknown."
severity = "critical"
required_evidence = ["invariant", "contract", "adversarial"]
risk = ["provenance"]

[[guarantees]]
id = "INV-LIVE-CAPACITY-TEMPORAL-001"
statement = "Each F4 projection uses one PostgreSQL-sourced observation instant and coherent read snapshot, projects only over effective possibly-discontinuous remaining operational intervals, and exposes open-ended interruption or resource occupation as uncertainty instead of fabricated temporal precision."
severity = "critical"
required_evidence = ["invariant", "contract", "adversarial"]
risk = ["temporal", "capacity"]

[[guarantees]]
id = "INV-LIVE-CAPACITY-DEDUP-001"
statement = "One real service contributes remaining workload at most once across Reservation, QueueEntry and ServiceSession representations; the live representation wins while a matching Reservation planned duration may survive only as estimate fallback provenance, never as a second work item."
severity = "critical"
required_evidence = ["invariant", "contract", "adversarial"]
risk = ["capacity", "provenance"]

[[guarantees]]
id = "INV-LIVE-CAPACITY-PRIVACY-001"
statement = "F4 staff, customer and cross-tenant projection surfaces remain least-privilege: tenant identifiers do not grant access, and customer projection exposes only approved self-relative status without other customers' identities, workloads, operational causes or historical samples."
severity = "critical"
required_evidence = ["invariant", "contract", "adversarial"]
risk = ["security"]

[[guarantees]]
id = "INV-COPILOT-ADMISSION-001"
statement = "F6 exposes bounded typed operational tools for external agents/applications over already-published owner commands and supported read contracts; Request Engine does not gain conversational authority, tenant/principal/party authority or hidden operational state from model output. F6 may execute only explicitly registered owner operations while preserving the owner's capability, concurrency, idempotency and authority gates, ambiguous authoritative entity lookup must fail closed rather than guess, and every public F6 request body accepts only its closed typed schema."
severity = "critical"
required_evidence = ["invariant", "contract", "adversarial", "concurrency"]
risk = ["security"]

[[guarantees]]
id = "FIT-ARCH-001"
statement = "Current module ownership remains explicit, dependency direction remains understandable and acyclic, and cross-module imports use published connection surfaces rather than internals."
severity = "critical"
required_evidence = ["fitness"]
risk = []

[[guarantees]]
id = "FIT-TYPE-BOUNDARY-001"
statement = "Business semantic layers, cross-module contracts, persistence mappings and HTTP/provider DTOs remain distinct type boundaries; transport technology and transport/persistence naming cannot silently leak inward."
severity = "critical"
required_evidence = ["fitness"]
risk = []

[[guarantees]]
id = "FIT-REPO-GOV-001"
statement = "Repository documentation and LLM instruction routing preserve one discoverable source-of-truth hierarchy, explicit path-local rules and semantic naming/ownership conventions without turning incidental repository shape into immutable snapshots."
severity = "critical"
required_evidence = ["fitness"]
risk = []

[[guarantees]]
id = "INV-FAILURE-001"
statement = "Rejected or failed public/runtime operations expose bounded, reproducible failure semantics without leaking private state or converting semantic rejection into unsafe retry loops."
severity = "high"
required_evidence = ["contract", "adversarial"]
risk = ["security"]

[[guarantees]]
id = "INV-NOTIFICATION-LINEAGE-001"
statement = "A notification escalation lineage advances sequentially: at most one live channel task exists per lineage (application step plus partial-unique DB backstop), concurrent escalation triggers serialize to exactly one next-channel child with deterministic loser semantics, and a replayed escalation decision is a no-op."
severity = "critical"
required_evidence = ["invariant", "adversarial", "concurrency"]
risk = ["provenance"]

[[guarantees]]
id = "INV-NOTIFICATION-TERMINAL-001"
statement = "An exhausted notification lineage always closes in an operator-visible terminal fact (fatigue_limited or unreachable) instead of silence, every escalation decision is audited through the append-only escalation ledger, and ledger identity and history cannot be rewritten."
severity = "critical"
required_evidence = ["invariant", "adversarial"]
risk = ["provenance"]

[[guarantees]]
id = "INV-DELIVERY-OUTCOME-001"
statement = "Transport outcome reports are persisted before interpretation and deduped; only fenced finalize mutates delivery state, a late contradictory report cannot downgrade a terminal delivery state, a report about an unknown identity is a durable no-op, and a malformed report becomes a rejected durable fact rather than guessed delivery state."
severity = "critical"
required_evidence = ["invariant", "adversarial"]
risk = ["provenance"]

[[guarantees]]
id = "INV-CONTACT-VERIFICATION-001"
statement = "Party and staff contact points are created unverified and become verified only through the explicit confirmation command; verification is monotonic (no role can downgrade a verified contact point through direct mutation) and deactivation never rewrites verification provenance."
severity = "critical"
required_evidence = ["invariant", "adversarial"]
risk = ["security"]

[[guarantees]]
id = "INV-WORKLOAD-AUTH-001"
statement = "A workload bearer credential authenticates identity only and resolves exclusively to workload-class Principals; subject-class gating prevents HUMAN credentials from activating workload Principals and workload credentials from activating HUMAN Principals, and authentication never confers business authority by itself."
severity = "critical"
required_evidence = ["invariant", "adversarial"]
risk = ["security"]

[[guarantees]]
id = "INV-AGENT-AUTHORITY-001"
statement = "An AGENT Principal's standing authority is bounded by the intersection of the provisioner's current active delegable authority and the operational authority plane; possessing a capability never implies delegability and agent-derived grants are never delegable."
severity = "critical"
required_evidence = ["invariant", "adversarial"]
risk = ["security"]

[[guarantees]]
id = "INV-AGENT-LIFECYCLE-001"
statement = "Agent suspension or revocation removes effective authorization immediately (fail-closed on identity-binding/principal state, without relying on token expiry), and revocation additionally revokes active workload credentials and disables the workload identity so the bearer token stops authenticating."
severity = "critical"
required_evidence = ["invariant", "adversarial"]
risk = ["security"]

[[guarantees]]
id = "INV-AGENT-PROVENANCE-001"
statement = "Agent provisioning provenance (sponsor, established_by, provenance reference) is immutable and append-preserving: lifecycle transitions and authority changes cannot rewrite who created the agent, under whose authority, or from which provisioning operation."
severity = "critical"
required_evidence = ["invariant", "adversarial"]
risk = ["provenance"]

[[guarantees]]
id = "INV-AGENT-POLICY-001"
statement = "An AGENT Principal without an explicit tool policy is denied every operation (fail closed, including routes without capability metadata), and effective agent authority is the granted ∩ allowed − denied intersection read fresh from the tenant-scoped policy on every request; policy rows remain tenant-isolated."
severity = "critical"
required_evidence = ["invariant", "adversarial", "contract"]
risk = ["security"]

[[guarantees]]
id = "INV-AGENT-RISK-001"
statement = "Agent execution is bounded by the policy risk ceiling: unclassified command capabilities deny agents, and AUTHORITY_CHANGE operations are unconditionally denied for agent actors regardless of grants, delegation or ceiling."
severity = "critical"
required_evidence = ["invariant", "adversarial", "contract"]
risk = ["security"]

[[guarantees]]
id = "INV-AGENT-BUDGET-001"
statement = "Per-minute agent mutation budgets are enforced through a race-safe conditional upsert so concurrent requests cannot exceed the configured limit within one window; exhausted budgets deny further mutations with 429 while read operations and other agents' budgets remain unaffected."
severity = "critical"
required_evidence = ["invariant", "adversarial", "concurrency"]
risk = ["security"]

[[guarantees]]
id = "INV-IDENTITY-TOPOLOGY-GATE-001"
statement = "Every command that can alter identity bindings, control grants, staff memberships or the reachability they express acquires the transaction-scoped identity-topology advisory gate as its first statement, before any row lock; global disable or global authority modification takes it exclusively, ordinary reads and native login never acquire it, and any unclassified topology writer fails a deterministic inventory proof."
severity = "critical"
required_evidence = ["invariant", "adversarial", "concurrency"]
risk = ["security"]

[[guarantees]]
id = "INV-IDENTITY-RECOVERY-001"
statement = "Governed native identity recovery requires a distinct HUMAN platform approver, stages the raw proof outside authoritative locks in a dedicated secret-delivery boundary, issues through one authoritative transaction that links case, recovery intent and delivery ticket, revokes intent and ticket atomically, and links consumption to the case in the same transaction; no raw proof reaches tables, audit facts, ordinary outbox or administrative responses. Issuance stages the raw proof create-if-absent in a dedicated secret store and the worker publishes it through a configured channel outside authoritative locks: a pre-transmission connection failure is retryable, an ambiguous post-transmission outcome is recorded unknown and never blindly republished, and a definitive refusal is terminal; each issuance attempt reserves its case generation before staging, so two concurrent issuances of one case reserve and stage distinct generations and a losing issuance discards only its own reserved generation, never the retained secret the winner's delivery ticket references."
severity = "critical"
required_evidence = ["invariant", "adversarial"]
risk = ["security", "provenance"]

[[guarantees]]
id = "INV-IDENTITY-BINDING-READ-001"
statement = "Tenant identity-binding inspection requires an explicit current identity.binding.read grant held by a HUMAN actor; the projection is tenant-opaque, so a foreign or absent binding is indistinguishable and never addressable, it never exposes the binding subject or verifier, and a read performs no authoritative mutation."
severity = "high"
required_evidence = ["invariant", "contract"]
risk = ["security"]

[[guarantees]]
id = "INV-IDENTITY-BINDING-LIFECYCLE-001"
statement = "A tenant identity-binding suspend/reactivate/revoke command requires an explicit current identity.bind grant held by a HUMAN actor, acquires the identity-topology gate and the ordered active-staff-membership lock root before any specific binding row, increments the binding revision exactly once under idempotency, rejects a stale revision, keeps revoke terminal, never resurrects a revoked binding, cannot remove the tenant's last authenticatable controller, and treats a foreign or absent binding as indistinguishable."
severity = "high"
required_evidence = ["invariant", "adversarial", "concurrency"]
risk = ["security"]

[[guarantees]]
id = "INV-NATIVE-IDENTITY-DISABLE-001"
statement = "A global native identity disable requires an explicit current platform.identity.disable grant held by a HUMAN platform operator, acquires the identity-topology gate EXCLUSIVE under a bounded lock timeout, terminally disables the identity and revokes its credentials, sessions and pending recovery intents in one transaction, and fails atomically unless every affected tenant and the platform plane retain an effective controller; bindings, grants and provenance remain historical facts and the identity is never re-enabled."
severity = "critical"
required_evidence = ["invariant", "adversarial"]
risk = ["security"]

[[guarantees]]
id = "INV-IDENTITY-LINK-SELF-001"
statement = "Self-service identity linking is HUMAN-only without delegation and requires a recent reauthentication of the actor's current identity on both the intent-create and intent-confirm operations; the second identity's proof is verified outside authoritative locks against the authority persisted on the intent, never a body-supplied hint, and the binding is created for the SAME tenant Principal, never an administrative or cross-Principal link. The second proof is either the second native identity's password or a verified external OIDC access token (RFC 9068 at+jwt) whose subject is verified against the intent's OIDC authority; native confirmation and subject confirmation are distinct primitives, a subject confirmation rejects a native authority, and an OIDC proof without a composed verifier fails closed. The short-TTL intent is consumed exactly once, at most one live pending intent may exist per actor+authority (enforced by a partial unique index and by expiring stale pending intents before create), a subject already linked in the tenant conflicts instead of being taken over, a foreign or absent intent is opaque, an invalid proof is an opaque 401, and no Principal, Party, staff membership or authority grant is merged, created or modified by linking."
severity = "high"
required_evidence = ["invariant", "adversarial"]
risk = ["security"]

[[guarantees]]
id = "INV-IDENTITY-PROVIDER-PORTABILITY-001"
statement = "An external identity provider is an authentication route, not a source of RE identity or authority: a verified external subject resolves only through an explicit active IdentityBinding to an existing Principal, so binding a subject from a second provider or retiring a configured provider changes neither the Principal nor its standing authority grants, and the native authentication path keeps operating when no external provider is configured."
severity = "high"
required_evidence = ["invariant", "adversarial"]
risk = ["security"]

[[guarantees]]
id = "INV-NATIVE-MULTI-SESSION-001"
statement = "A native identity may hold multiple concurrent active sessions; each authenticates independently and records its own activity and authentication timestamps. Revoking one session leaves the others authenticating, while a global invalidation (revoke_native_sessions or password rotation) bumps the identity session epoch and invalidates every outstanding session."
severity = "high"
required_evidence = ["invariant", "adversarial"]
risk = ["security"]

[[guarantees]]
id = "INV-TENANT-IDENTITY-AUDIT-001"
statement = "Every tenant staff, agent and integration identity command commits exactly one append-only audit row in request_engine.audit_records in the same transaction as its authoritative effect, carrying the acting Principal, the target subject kind/id, the action, a closed reason code, and the real before/after aggregate revisions; an idempotent replay commits no second row, a rejected or rolled-back command commits none, the runtime application role can neither update nor delete audit history, tenant RLS hides another tenant's rows, and no token, verifier, login handle or raw secret ever enters the audit details."
severity = "critical"
required_evidence = ["invariant", "adversarial"]
risk = ["security", "provenance"]

[[guarantees]]
id = "INV-CONTROLLER-POLICY-UPGRADE-001"
statement = "A controller-policy upgrade requires an explicit current controller_policy_upgrade grant held by a HUMAN actor, acquires the identity-topology gate and the ordered active-staff-membership lock root before any specific row, resolves both policy keys against the immutable initial-controller-policies catalog, and upgrades a target tenant Principal only by adding the target policy's currently missing capabilities within the actor's current delegable ceiling; it never restores a revoked grant, never upgrades the actor itself, rejects a stale authority revision, is idempotent, treats a foreign or absent target as indistinguishable, and commits exactly one append-only audit row with the source/target policy keys and real before/after revisions and no secret material."
severity = "high"
required_evidence = ["invariant", "adversarial"]
risk = ["security", "provenance"]

[[guarantees]]
id = "INV-ONBOARDING-READINESS-001"
statement = "The onboarding readiness projection is an advisory, tenant-scoped composition of owner-published facts: it exposes identity, tenant_control, staff_administration and recovery sections with an explicit ready/blocked/unknown status, never reports a section ready when its owner reader failed (unknown, ready=false, no fabricated blockers), never derives authority or identity from the response, and never leaks another tenant's or the platform's identities, secrets or global recovery configuration. Identity/control facts are read through a tenant-guarded least-privilege surface that refuses any organization other than the transaction's current tenant, and each command the projection suggests revalidates its own authority."
severity = "high"
required_evidence = ["invariant", "contract", "adversarial"]
risk = ["security"]

[[guarantees]]
id = "INV-RESOURCE-AUTHORITY-INSPECTION-001"
statement = "The self resource-authority inspection query returns an advisory allowed/denied/indeterminate decision about the caller's own effective authority for an explicitly supported operation, computed by the owning module's current authority primitive rather than by Tenancy: the decision agrees with the owner authorization for the same revision, a foreign or absent target is indistinguishable from a random identifier and yields the same opaque 404, the actor organization and principal always come from the trusted ActorContext and never from the request body, and the operation never mutates authority, idempotency, audit or outbox state."
severity = "high"
required_evidence = ["invariant", "contract", "adversarial"]
risk = ["security"]

[[guarantees]]
id = "INV-INSTANCE-CLAIM-001"
statement = "The installation trust root is created by at most one atomic first claim: before finalize no Principal, identity binding, authority grant, native identity or credential exists for the installation, finalize promotes the pending native identity and a verified WebAuthn authenticator, grants the immutable platform-owner-v1 policy, promotes the setup recovery codes, consumes the SetupSession and transitions the instance UNCLAIMED to CLAIMED exactly once, and setup never reopens or admits a second owner."
severity = "critical"
required_evidence = ["invariant", "adversarial"]
risk = ["security", "provenance"]

[[guarantees]]
id = "INV-INSTANCE-CLAIM-IDEMPOTENCY-001"
statement = "Finalizing the instance claim is idempotent only for the exact same request: an exact replay sharing both the Idempotency-Key and the request fingerprint over operation, SetupSession and provenance returns the original non-secret receipt and performs no second effect, while reusing the key with different request content is rejected as a conflict and never returns a foreign receipt."
severity = "critical"
required_evidence = ["invariant", "adversarial"]
risk = ["security", "provenance"]

[[guarantees]]
id = "INV-SETUP-SESSION-ISOLATION-001"
statement = "A SetupSession is a bounded, single-use installation bearer that is never a Principal session and never confers business authority; completing a setup WebAuthn registration requires the presented SetupSession to own the challenge being consumed, so a valid bearer for another ceremony cannot complete it, and a consumed session is never reactivated."
severity = "critical"
required_evidence = ["invariant", "adversarial"]
risk = ["security"]

[[guarantees]]
id = "INV-NATIVE-WEBAUTHN-LOGIN-001"
statement = "A valid native WebAuthn assertion completes a bounded one-time challenge and issues a brand-new normal native session whose trusted evidence (initial authenticator, proven methods, user verification and derived assurance) reflects only the verified ceremony; the caller cannot supply assurance, user verification or methods, and a decoy options response for an unknown or credential-less login handle is indistinguishable in shape from a real ceremony so the endpoint is not a reliable account-enumeration oracle."
severity = "critical"
required_evidence = ["invariant", "adversarial", "contract"]
risk = ["security"]

[[guarantees]]
id = "INV-PHISHING-RESISTANT-ASSURANCE-001"
statement = "PHISHING_RESISTANT assurance is derived only from a verified WebAuthn ceremony that accepted user verification; a WebAuthn method without accepted UV is a possession factor, a recovery-derived session is always RECOVERY, and no caller-supplied value can raise a session's assurance."
severity = "critical"
required_evidence = ["invariant", "adversarial"]
risk = ["security"]

[[guarantees]]
id = "INV-WEBAUTHN-STEP-UP-001"
statement = "A native session can acquire stronger assurance only through a valid WebAuthn step-up whose challenge belongs to that exact session and whose credential belongs to the session's native identity; another session or identity cannot elevate it, and a recovery-derived session cannot escape RECOVERY through step-up."
severity = "critical"
required_evidence = ["invariant", "adversarial", "contract"]
risk = ["security"]

[[guarantees]]
id = "INV-WEBAUTHN-CHALLENGE-SINGLE-USE-001"
statement = "Authentication and step-up challenges are bounded, single-purpose and single-consumption: a completed or expired challenge cannot be replayed, a failed verification does not consume it, and concurrent completions of one challenge produce at most one authoritative effect with the loser failing closed."
severity = "high"
required_evidence = ["invariant", "adversarial"]
risk = ["security"]

[[guarantees]]
id = "INV-PRIVILEGED-AUTH-FRESHNESS-001"
statement = "The reusable privileged-authentication guard fails closed on trusted session evidence and distinguishes insufficient assurance (including any recovery-derived session) from stale strong authentication, so a sensitive operation can require recent phishing-resistant authentication without hard-coding checks in individual routers."
severity = "high"
required_evidence = ["contract"]
risk = ["security"]

[[guarantees]]
id = "INV-NATIVE-SESSION-INTROSPECTION-001"
statement = "Reading the current native session returns only the trusted persisted evidence of the bearer's own session (proven methods, derived assurance, user verification, recovery-derived flag and trusted authentication time); the request cannot select a session, identity, assurance or method, and an unusable session fails closed with the same opaque authentication error as other native routes."
severity = "high"
required_evidence = ["contract"]
risk = ["security"]
[[guarantees]]
id = "INV-OFFLINE-ADMIN-RECOVERY-001"
statement = "A native Platform Owner who retains one unused setup-issued recovery code can replace the owning identity's password without the previous password, SMTP, OpenBao/Vault, an existing session or a live WebAuthn authenticator; code consumption and password replacement are one atomic transaction, all existing native sessions and pending recovery intents are revoked, the code is single-use, setup never reopens, and no old password or recovery plaintext is durably recoverable."
severity = "critical"
required_evidence = ["invariant", "adversarial", "contract"]
risk = ["security", "availability"]

[[guarantees]]
id = "INV-PLATFORM-SECRET-STORE-001"
statement = "Reversible platform secret material is accessed through the provider-neutral PlatformSecretStore boundary; the OpenBao reference adapter derives backend paths from opaque UUIDs, creates/rotates with KV-v2 CAS rather than blind overwrite, exposes plaintext only through the trusted runtime resolve operation, supports tokenless OpenBao-Agent proxy mode, and never includes plaintext or authentication tokens in raised backend errors."
severity = "high"
required_evidence = ["contract", "adversarial"]
risk = ["security", "availability"]

[[guarantees]]
id = "INV-PLATFORM-CONFIG-REVISION-001"
statement = "Platform operational configuration is persisted as private typed/provider revisions rather than generic key/value state; staged payload and secret-binding identity are immutable, lifecycle transitions are monotonic, at most one revision per configuration kind can be ACTIVE, secret bindings contain only opaque backend identifiers and versions, and ordinary application runtime roles have no direct table authority over configuration, bindings or append-only configuration facts."
severity = "high"
required_evidence = ["invariant", "adversarial"]
risk = ["security", "provenance"]
