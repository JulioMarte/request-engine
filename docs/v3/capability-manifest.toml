schema_version = 1
freeze_ready = false

# status values:
# implemented  = a current Python/application vertical exists
# contract     = normative contract exists but the vertical is not implemented yet
# internal     = semantic internal operation, not an arbitrary end-user capability
#
# permission is an authorization requirement. It is intentionally separate from id.
# Equality between capability id and permission is allowed but never assumed.

