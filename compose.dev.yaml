# DEVELOPMENT-ONLY full local stack. Not a deployment definition.
#
# Drive it through `scripts/dev/local_stack.py` (or the .ps1/.sh wrappers): the
# orchestrator generates dev-only secrets into a gitignored env file, stages
# migrate -> runtime roles -> services -> optional dev claim -> worker, and
# refuses non-local Docker hosts. Running `docker compose up` directly fails
# fast because every secret is a required interpolation.
#
# The Request Engine image is the same deploy/reference/Dockerfile used by the
# black-box CI platform. Every host port binds to 127.0.0.1 only. PostgreSQL
# and the worker stay on the internal backend network.

x-request-engine: &request-engine
  image: request-engine:${RE_DEV_IMAGE_TAG:-dev-local}
  pull_policy: never

services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:18
    environment:
      POSTGRES_DB: request_engine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${RE_DEV_POSTGRES_PASSWORD:?generated by scripts/dev/local_stack.py}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d request_engine"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [backend]

  migrate:
    <<: *request-engine
    build:
      context: .
      dockerfile: deploy/reference/Dockerfile
    profiles: [setup]
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:${RE_DEV_POSTGRES_PASSWORD:?}@postgres:5432/request_engine
    command: [alembic, upgrade, head]
    restart: "no"
    networks: [backend]

  api:
    <<: *request-engine
    environment:
      REQUEST_ENGINE_DATABASE_URL: postgresql+psycopg://re_dev_app:${RE_DEV_APP_PASSWORD:?}@postgres:5432/request_engine
      REQUEST_ENGINE_NATIVE_IDENTITY_AUTHORITY_ID: ${RE_DEV_NATIVE_AUTHORITY_ID:-}
      REQUEST_ENGINE_APPOINTMENT_OPTION_SIGNING_KEY: ${RE_DEV_APPOINTMENT_SIGNING_KEY:?}
      REQUEST_ENGINE_IDENTITY_EXCHANGE_FINGERPRINT_KEY: ${RE_DEV_FINGERPRINT_KEY:?}
      REQUEST_ENGINE_WEBAUTHN_DECOY_KEY: ${RE_DEV_WEBAUTHN_DECOY_KEY:?}
      REQUEST_ENGINE_WEBAUTHN_RP_ID: localhost
      REQUEST_ENGINE_WEBAUTHN_ALLOWED_ORIGINS: http://localhost:${RE_DEV_CONSOLE_PORT:?}
    command: [uvicorn, "request_engine.bootstrap.server:create_app", --factory, --host, "0.0.0.0", --port, "8000"]
    ports: ["127.0.0.1:${RE_DEV_API_PORT:?}:8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 40
    networks: [edge, backend]

  control-plane:
    <<: *request-engine
    environment:
      REQUEST_ENGINE_DATABASE_URL: postgresql+psycopg://re_dev_app:${RE_DEV_APP_PASSWORD:?}@postgres:5432/request_engine
      REQUEST_ENGINE_PLATFORM_READ_DATABASE_URL: postgresql+psycopg://re_dev_read:${RE_DEV_READ_PASSWORD:?}@postgres:5432/request_engine
      REQUEST_ENGINE_PLATFORM_CONTROL_DATABASE_URL: postgresql+psycopg://re_dev_control:${RE_DEV_CONTROL_PASSWORD:?}@postgres:5432/request_engine
      REQUEST_ENGINE_NATIVE_IDENTITY_AUTHORITY_ID: ${RE_DEV_NATIVE_AUTHORITY_ID:-}
      REQUEST_ENGINE_WEBAUTHN_DECOY_KEY: ${RE_DEV_WEBAUTHN_DECOY_KEY:?}
      # Passkeys are created in the browser at the console origin.
      REQUEST_ENGINE_WEBAUTHN_RP_ID: localhost
      REQUEST_ENGINE_WEBAUTHN_ALLOWED_ORIGINS: http://localhost:${RE_DEV_CONSOLE_PORT:?}
    command: [uvicorn, "request_engine.bootstrap.platform_server:create_app", --factory, --host, "0.0.0.0", --port, "8001"]
    ports: ["127.0.0.1:${RE_DEV_CONTROL_PORT:?}:8001"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready',timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 40
    networks: [edge, backend]

  console:
    <<: *request-engine
    depends_on:
      control-plane:
        condition: service_healthy
    environment:
      REQUEST_ENGINE_ADMIN_CONSOLE_CONTROL_API_BASE_URL: http://control-plane:8001
      REQUEST_ENGINE_ADMIN_CONSOLE_RUNTIME_API_BASE_URL: http://api:8000
      REQUEST_ENGINE_ADMIN_CONSOLE_PUBLIC_RUNTIME_API_BASE_URL: http://localhost:${RE_DEV_API_PORT:?}
      REQUEST_ENGINE_ADMIN_CONSOLE_WORKLOAD_AUTHORITY_ID: ${RE_DEV_WORKLOAD_AUTHORITY_ID:-}
      REQUEST_ENGINE_ADMIN_CONSOLE_SESSION_SECRET: ${RE_DEV_CONSOLE_SESSION_SECRET:?}
      REQUEST_ENGINE_ADMIN_CONSOLE_SESSION_STORE_DIRECTORY: /home/request-engine/console-sessions
      # Plain-HTTP localhost only; production keeps the Secure-cookie default.
      REQUEST_ENGINE_ADMIN_CONSOLE_COOKIE_SECURE: "false"
    command: [uvicorn, "request_engine.bootstrap.admin_console_server:create_app", --factory, --host, "0.0.0.0", --port, "8002"]
    ports: ["127.0.0.1:${RE_DEV_CONSOLE_PORT:?}:8002"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/ready',timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 40
    networks: [edge, backend]

  # Dev-only loopback receiver for the worker's outbox publisher (HTTP) and the
  # webhook delivery transport (HTTPS with a generated dev CA). It is never a
  # production default: production still fails closed without a configured
  # publisher and an operator-supplied HTTPS webhook.
  dev-gateway:
    <<: *request-engine
    environment:
      RE_DEV_GATEWAY_DEVELOPMENT_ONLY: "acknowledged"
      RE_DEV_GATEWAY_CERT_FILE: /tls/dev-gateway.crt
      RE_DEV_GATEWAY_KEY_FILE: /tls/dev-gateway.key
    command: [python, /dev-gateway/dev_gateway.py]
    volumes:
      - ./scripts/dev/dev_gateway.py:/dev-gateway/dev_gateway.py:ro
      - ${RE_DEV_TLS_DIR:?}/dev-gateway.crt:/tls/dev-gateway.crt:ro
      - ${RE_DEV_TLS_DIR:?}/dev-gateway.key:/tls/dev-gateway.key:ro
    ports: ["127.0.0.1:${RE_DEV_GATEWAY_PORT:?}:8090"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health',timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [edge, backend]

  worker:
    <<: *request-engine
    profiles: [worker]
    depends_on:
      dev-gateway:
        condition: service_healthy
    environment:
      REQUEST_ENGINE_WORKER_FACTORY: request_engine.bootstrap.reference_worker_factory:create_worker
      REQUEST_ENGINE_WORKER_DATABASE_URL: postgresql+psycopg://re_dev_worker:${RE_DEV_WORKER_PASSWORD:?}@postgres:5432/request_engine
      REQUEST_ENGINE_APP_DATABASE_URL: postgresql+psycopg://re_dev_app:${RE_DEV_APP_PASSWORD:?}@postgres:5432/request_engine
      # A genuine integration principal provisioned over the public API; the
      # reference factory refuses to start while it is empty.
      REQUEST_ENGINE_WORKER_PRINCIPAL_ID: ${RE_DEV_WORKER_PRINCIPAL_ID:-}
      REQUEST_ENGINE_OUTBOX_PUBLISHER_FACTORY: request_engine.bootstrap.http_outbox_publisher:create_publisher
      REQUEST_ENGINE_OUTBOX_PUBLISH_URL: http://dev-gateway:8090/events
      # HTTPS stays mandatory; the worker trusts only the generated dev CA.
      REQUEST_ENGINE_WEBHOOK_BASE_URL: https://dev-gateway:8443/webhook
      SSL_CERT_FILE: /tls/dev-ca.crt
    volumes:
      - ${RE_DEV_TLS_DIR:?}/dev-ca.crt:/tls/dev-ca.crt:ro
    command: [request-engine-worker]
    restart: unless-stopped
    networks: [backend]

volumes:
  postgres-data: {}

networks:
  edge: {}
  backend:
    internal: true
