worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log /dev/stdout;
    client_max_body_size 16k;

    upstream request_engine_api {
        server api:8000;
        keepalive 4;
    }

    upstream request_engine_api_replica {
        server api-replica:8000;
        keepalive 4;
    }

    server {
        listen 443 ssl;
        server_name api-lab;
        ssl_certificate /tls/api-lab.crt;
        ssl_certificate_key /tls/api-lab.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location = /health/ready {
            proxy_pass http://request_engine_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /auth/native/webauthn/authentication-options {
            if ($request_method != POST) { return 405; }
            proxy_pass http://request_engine_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / { return 404; }
    }

    server {
        listen 443 ssl;
        server_name api-replica-lab;
        ssl_certificate /tls/api-replica-lab.crt;
        ssl_certificate_key /tls/api-replica-lab.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location = /health/ready {
            proxy_pass http://request_engine_api_replica;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /auth/native/webauthn/authentication-options {
            if ($request_method != POST) { return 405; }
            proxy_pass http://request_engine_api_replica;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / { return 404; }
    }
}
