name: Materialize rebaseline candidate

on:
  push:
    branches:
      - cohesion/rebaseline-candidate
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cohesion/rebaseline-candidate
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Download audited CI 4164 candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/rebaseline-artifact"
          mkdir -p "$artifact_dir"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/9998949598/zip" \
            > "$RUNNER_TEMP/rebaseline-artifact.zip"
          unzip -q "$RUNNER_TEMP/rebaseline-artifact.zip" -d "$artifact_dir"
          test -f "$artifact_dir/rebaseline-candidate.sql"
          test -f "$artifact_dir/rebaseline-role-bootstrap.sql"
      - name: Materialize exact readable baseline sources
        run: |
          set -euo pipefail
          python scripts/db/materialize_rebaseline_candidate.py \
            --artifact-dir "$RUNNER_TEMP/rebaseline-artifact" \
            --output-dir migrations/rebaseline_candidate
      - name: Commit only verified materialized sources
        run: |
          set -euo pipefail
          git add \
            migrations/rebaseline_candidate/0001_roles.sql \
            migrations/rebaseline_candidate/0001_schema.01.sql \
            migrations/rebaseline_candidate/0001_schema.02.sql \
            migrations/rebaseline_candidate/0001_schema.03.sql \
            migrations/rebaseline_candidate/0001_schema.04.sql \
            migrations/rebaseline_candidate/0001_schema.05.sql \
            migrations/rebaseline_candidate/0001_schema.06.sql
          if git diff --cached --quiet; then
            echo 'Audited rebaseline candidate is already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'materialize audited readable rebaseline schema'
          git push origin HEAD:cohesion/rebaseline-candidate
