name: Phase 2B format repair

on:
  push:
    branches: [phase-2b-slot-offers]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Resolve development environment
        run: uv sync --all-groups
      - name: Repair known long-line contexts
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/request_engine/modules/queue/adapters/db/slot_offer_commands.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '                await complete_idempotency(session, idempotency_id, {"offer": _offer_to_json(offer)})\n',
              '                await complete_idempotency(\n'
              '                    session, idempotency_id, {"offer": _offer_to_json(offer)}\n'
              '                )\n',
          )
          path.write_text(text, encoding="utf-8")

          path = Path("tests/integration/v3_slot_offer_recovery/test_slot_offer_recovery.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '        (fixture.organization_id, fixture.offering_id, fixture.first_subject_id, fixture.location_id),\n',
              '        (\n'
              '            fixture.organization_id,\n'
              '            fixture.offering_id,\n'
              '            fixture.first_subject_id,\n'
              '            fixture.location_id,\n'
              '        ),\n',
          )
          text = text.replace(
              '    with pytest.raises(CheckViolation, match="Hold subject does not match"):\n'
              '        with admin_conn.transaction():\n',
              '    with (\n'
              '        pytest.raises(CheckViolation, match="Hold subject does not match"),\n'
              '        admin_conn.transaction(),\n'
              '    ):\n',
          )
          path.write_text(text, encoding="utf-8")
          PY
      - name: Apply repository Ruff policy
        run: |
          uv run ruff check . --fix --unsafe-fixes
          uv run ruff format .
          uv run ruff check .
      - name: Commit formatting repair when needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Format Phase 2B implementation"
          git push origin HEAD:phase-2b-slot-offers
