name: Phase 2B format repair

on:
  push:
    branches: [phase-2b-slot-offers]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Resolve development environment
        run: uv sync --all-groups
      - name: Apply repository Ruff policy
        run: |
          uv run ruff check . --fix --unsafe-fixes
          uv run ruff format .
      - name: Commit formatting repair when needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Format Phase 2B implementation"
          git push origin HEAD:phase-2b-slot-offers
