name: Temporary architecture repair

on:
  push:
    branches:
      - feature/operational-profile-contextual-supply

permissions:
  contents: write
  statuses: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[architecture-fix]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Publish repair pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"Request Engine / architecture repair\",\"description\":\"Validating architecture repair\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --all-groups

      - name: Apply architecture repair
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one pattern in {path}, found {count}: {old[:120]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          platform_authority = Path(
              "src/request_engine/platform/security/operational_authority.py"
          )
          platform_authority.write_text(
              '''from dataclasses import dataclass\nfrom typing import cast\nfrom uuid import UUID\n\nfrom sqlalchemy import text\nfrom sqlalchemy.ext.asyncio import AsyncSession\n\nMANAGE_OPERATIONAL_PROFILE_SCOPE = "operations.manage_profile"\nMANAGE_CONTEXTUAL_SUPPLY_SCOPE = "operations.manage_supply"\nMANAGE_COMMERCIAL_TERMS_SCOPE = "operations.manage_terms"\n\n\nclass OperationalAuthorityRequired(PermissionError):\n    def __init__(self, authority_party_id: UUID, scope_key: str) -> None:\n        super().__init__(f"operational authority required for scope {scope_key}")\n        self.authority_party_id = authority_party_id\n        self.scope_key = scope_key\n\n\n@dataclass(frozen=True, slots=True)\nclass OperationalAuthorityGrant:\n    representation_id: UUID\n    authority_party_id: UUID\n    scope_key: str\n\n    def audit_details(self) -> dict[str, str]:\n        return {\n            "representation_id": str(self.representation_id),\n            "authority_party_id": str(self.authority_party_id),\n            "scope_key": self.scope_key,\n        }\n\n\nasync def require_operational_authority(\n    session: AsyncSession,\n    *,\n    organization_id: UUID,\n    principal_id: UUID,\n    authority_party_id: UUID,\n    scope_key: str,\n) -> OperationalAuthorityGrant:\n    """Require current exact-scope Representation authority inside the caller transaction."""\n    if not scope_key:\n        raise ValueError("scope_key is required")\n\n    row = (\n        (\n            await session.execute(\n                text(\n                    """\n                    SELECT representation_id\n                    FROM request_engine.lock_current_party_authority(\n                        :organization_id,\n                        :principal_id,\n                        :authority_party_id,\n                        :scope_key\n                    )\n                    """\n                ),\n                {\n                    "organization_id": organization_id,\n                    "principal_id": principal_id,\n                    "authority_party_id": authority_party_id,\n                    "scope_key": scope_key,\n                },\n            )\n        )\n        .mappings()\n        .first()\n    )\n    if row is None:\n        raise OperationalAuthorityRequired(authority_party_id, scope_key)\n    return OperationalAuthorityGrant(\n        representation_id=cast(UUID, row["representation_id"]),\n        authority_party_id=authority_party_id,\n        scope_key=scope_key,\n    )\n''',
              encoding="utf-8",
          )

          Path(
              "src/request_engine/modules/tenancy/contracts/operational_authority.py"
          ).write_text(
              '''from request_engine.platform.security.operational_authority import (\n    MANAGE_COMMERCIAL_TERMS_SCOPE,\n    MANAGE_CONTEXTUAL_SUPPLY_SCOPE,\n    MANAGE_OPERATIONAL_PROFILE_SCOPE,\n    OperationalAuthorityGrant,\n    OperationalAuthorityRequired,\n)\n\n__all__ = (\n    "MANAGE_COMMERCIAL_TERMS_SCOPE",\n    "MANAGE_CONTEXTUAL_SUPPLY_SCOPE",\n    "MANAGE_OPERATIONAL_PROFILE_SCOPE",\n    "OperationalAuthorityGrant",\n    "OperationalAuthorityRequired",\n)\n''',
              encoding="utf-8",
          )

          Path(
              "src/request_engine/modules/tenancy/adapters/db/operational_authority.py"
          ).write_text(
              '''from request_engine.platform.security.operational_authority import (\n    require_operational_authority,\n)\n\n__all__ = ("require_operational_authority",)\n''',
              encoding="utf-8",
          )

          replace_once(
              Path("src/request_engine/modules/catalog/adapters/db/operational_config_commands.py"),
              '''from request_engine.modules.tenancy.adapters.db.operational_authority import (\n    require_operational_authority,\n)\nfrom request_engine.modules.tenancy.contracts.operational_authority import (\n    MANAGE_OPERATIONAL_PROFILE_SCOPE,\n)\n''',
              '''from request_engine.platform.security.operational_authority import (\n    MANAGE_OPERATIONAL_PROFILE_SCOPE,\n    require_operational_authority,\n)\n''',
          )

          replace_once(
              Path("src/request_engine/modules/booking/adapters/db/contextual_config_commands.py"),
              '''from request_engine.modules.tenancy.adapters.db.operational_authority import (\n    require_operational_authority,\n)\nfrom request_engine.modules.tenancy.contracts.operational_authority import (\n    MANAGE_COMMERCIAL_TERMS_SCOPE,\n    MANAGE_CONTEXTUAL_SUPPLY_SCOPE,\n)\n''',
              '''from request_engine.platform.security.operational_authority import (\n    MANAGE_COMMERCIAL_TERMS_SCOPE,\n    MANAGE_CONTEXTUAL_SUPPLY_SCOPE,\n    require_operational_authority,\n)\n''',
          )

          workflow = Path(".github/workflows/ci.yml")
          text = workflow.read_text(encoding="utf-8")
          start_marker = "      - name: Apply immutable V3 candidate\n"
          end_marker = "\n  # This is the active post-baseline product gate."
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("could not locate frozen V3 compatibility step block")
          replacement = '''      - name: Run frozen V3 release compatibility proof\n        run: bash scripts/ci/run_v3_candidate_with_g19.sh\n      - name: Upload frozen V3 compatibility evidence\n        if: always()\n        uses: actions/upload-artifact@v4\n        with:\n          name: v3-candidate-release-proof\n          path: .phase6/\n          include-hidden-files: true\n          if-no-files-found: warn\n'''
          workflow.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY

      - name: Canonical formatting and static proof
        run: |
          uv run ruff check --fix \
            src/request_engine/platform/security/operational_authority.py \
            src/request_engine/modules/tenancy/contracts/operational_authority.py \
            src/request_engine/modules/tenancy/adapters/db/operational_authority.py \
            src/request_engine/modules/catalog/adapters/db/operational_config_commands.py \
            src/request_engine/modules/booking/adapters/db/contextual_config_commands.py
          uv run ruff format \
            src/request_engine/platform/security/operational_authority.py \
            src/request_engine/modules/tenancy/contracts/operational_authority.py \
            src/request_engine/modules/tenancy/adapters/db/operational_authority.py \
            src/request_engine/modules/catalog/adapters/db/operational_config_commands.py \
            src/request_engine/modules/booking/adapters/db/contextual_config_commands.py
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright
          uv run pytest tests/architecture -q

      - name: Commit architecture repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            src/request_engine/platform/security/operational_authority.py \
            src/request_engine/modules/tenancy/contracts/operational_authority.py \
            src/request_engine/modules/tenancy/adapters/db/operational_authority.py \
            src/request_engine/modules/catalog/adapters/db/operational_config_commands.py \
            src/request_engine/modules/booking/adapters/db/contextual_config_commands.py
          git diff --cached --check
          git commit -m "fix: restore F1 architecture boundaries and V3 proof wiring [architecture-fix]"
          git push origin HEAD:feature/operational-profile-contextual-supply

      - name: Publish repair final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "${JOB_STATUS}" = "success" ]; then
            STATE=success
            DESCRIPTION="Architecture repair validated and published"
          else
            STATE=failure
            DESCRIPTION="Architecture repair failed validation"
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${STATE}\",\"context\":\"Request Engine / architecture repair\",\"description\":\"${DESCRIPTION}\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
