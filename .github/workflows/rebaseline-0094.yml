name: PostgreSQL 18 canonical baseline proof

on:
  push:
    branches:
      - feature/rebaseline-0094
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-baseline-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.5"

jobs:
  canonical-baseline:
    name: Prove canonical 0001 and current product
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: request_engine_current
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d request_engine_current"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: request_engine_current
      PGUSER: postgres
      PGPASSWORD: postgres
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/request_engine_current
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Require canonical collapsed history
        run: |
          test ! -e scripts/db/promote_rebaseline_0094.py
          test ! -e scripts/db/build_rebaseline_0094_candidate.sh
          mapfile -t revisions < <(find migrations/versions -maxdepth 1 -type f -name '*.py' ! -name '__init__.py' -printf '%f\n' | sort)
          printf 'active revisions: %s\n' "${revisions[*]}"
          [[ "${#revisions[@]}" -eq 1 ]]
          [[ "${revisions[0]}" == "0001_initial.py" ]]
          mapfile -t heads < <(uv run alembic heads | awk 'NF {print $1}')
          [[ "${#heads[@]}" -eq 1 ]]
          [[ "${heads[0]}" == "0001_initial" ]]

      - name: Install repository
        run: uv sync --all-groups

      - name: Run baseline architecture contracts
        run: >-
          uv run pytest
          tests/architecture/test_alembic_revision_contract.py
          tests/architecture/test_alembic_revision_identifiers.py
          tests/architecture/test_baseline_repository_contract.py
          tests/unit/test_baseline_loader.py
          tests/unit/test_export_seed_data_catalog.py
          tests/unit/test_verify_accepted_baseline.py
          -q --tb=short

      - name: Run canonical current-product proof
        run: bash scripts/ci/run_current_product.sh

      - name: Upload canonical baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-baseline-proof-${{ github.sha }}
          path: .ci/current-product/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
