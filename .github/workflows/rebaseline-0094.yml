name: Promote and verify certified PostgreSQL 18 rebaseline

on:
  push:
    branches:
      - feature/rebaseline-0094
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  UV_VERSION: "0.12.5"

jobs:
  rebaseline:
    name: Promote or verify canonical 0001
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: request_engine_current
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d request_engine_current"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: request_engine_current
      PGUSER: postgres
      PGPASSWORD: postgres
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/request_engine_current
      REBASELINE_PROOF_DIR: .ci/rebaseline-proof
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Detect rebaseline state
        id: state
        shell: bash
        run: |
          if [[ -f migrations/versions/0094_managed_oidc_readiness.py ]]; then
            echo "mode=promote" >> "$GITHUB_OUTPUT"
            echo "historical 0002..0094 chain is present; promotion mode"
          else
            echo "mode=verify" >> "$GITHUB_OUTPUT"
            echo "historical chain is absent; post-promotion verification mode"
          fi

      - name: Download certified schema-and-seed proof
        if: steps.state.outputs.mode == 'promote'
        run: >-
          gh run download 36354361866
          --repo "${GITHUB_REPOSITORY}"
          --name rebaseline-0094-clean-cluster-proof-v2
          --dir "${REBASELINE_PROOF_DIR}"

      - name: Prepare destructive promotion from certified artifact
        if: steps.state.outputs.mode == 'promote'
        run: python scripts/db/promote_rebaseline_0094.py

      - name: Install repository
        run: uv sync --all-groups

      - name: Require collapsed Alembic history
        run: |
          mapfile -t revisions < <(find migrations/versions -maxdepth 1 -type f -name '*.py' ! -name '__init__.py' -printf '%f\n' | sort)
          printf 'active revisions: %s\n' "${revisions[*]}"
          [[ "${#revisions[@]}" -eq 1 ]]
          [[ "${revisions[0]}" == "0001_initial.py" ]]
          mapfile -t heads < <(uv run alembic heads | awk 'NF {print $1}')
          [[ "${#heads[@]}" -eq 1 ]]
          [[ "${heads[0]}" == "0001_initial" ]]

      - name: Run baseline architecture contracts
        run: >-
          uv run pytest
          tests/architecture/test_alembic_revision_contract.py
          tests/architecture/test_alembic_revision_identifiers.py
          tests/architecture/test_baseline_repository_contract.py
          tests/unit/test_baseline_loader.py
          tests/unit/test_verify_accepted_baseline.py
          -q --tb=short

      - name: Run canonical current-product proof
        run: bash scripts/ci/run_current_product.sh

      - name: Check promotion diff
        if: steps.state.outputs.mode == 'promote'
        run: |
          git diff --check -- . ':(exclude)migrations/baseline/0001_schema.*.sql'
          git status --short
          test -z "$(find migrations/versions -maxdepth 1 -type f -name '0*.py' ! -name '0001_initial.py' -print -quit)"

      - name: Commit certified baseline promotion
        if: steps.state.outputs.mode == 'promote'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "db: promote certified 0094 model into canonical baseline"
          git push origin HEAD:feature/rebaseline-0094

      - name: Upload rebaseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebaseline-0094-${{ steps.state.outputs.mode }}-evidence
          path: |
            .ci/rebaseline-proof/
            .ci/current-product/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
