name: Temporary Ruff autofix

on:
  push:
    branches:
      - feature/operational-profile-contextual-supply

permissions:
  contents: write

jobs:
  autofix:
    if: ${{ !contains(github.event.head_commit.message, '[ruff-autofix]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Resolve development environment
        run: uv sync --all-groups
      - name: Apply canonical Ruff fixes and formatting
        run: |
          uv run ruff check --fix . || true
          uv run ruff format .
      - name: Commit canonical formatting when needed
        run: |
          if git diff --quiet; then
            echo "No Ruff changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply canonical Ruff fixes [ruff-autofix]"
          git push origin HEAD:feature/operational-profile-contextual-supply
