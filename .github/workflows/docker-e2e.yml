name: Docker E2E
on:
  pull_request:
    branches: [development]
  workflow_dispatch:
concurrency:
  group: docker-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docker-reference-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - name: Build reference image
        run: docker compose -f deploy/reference/compose.e2e.yaml build
      - name: Start infrastructure
        run: docker compose -f deploy/reference/compose.e2e.yaml up -d postgres vault mailpit
      - name: Migrate and create runtime logins
        run: |
          docker compose -f deploy/reference/compose.e2e.yaml run --rm migrate
          docker compose -f deploy/reference/compose.e2e.yaml run --rm runtime-roles
      - name: Bootstrap native trust root through CLI
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose -f deploy/reference/compose.e2e.yaml)
          bootstrap_dsn='postgresql://postgres@postgres:5432/request_engine'
          issue="$(${compose[@]} run --rm -e REQUEST_ENGINE_BOOTSTRAP_DSN="$bootstrap_dsn" api request-engine-platform-bootstrap issue --provenance "github-actions:${GITHUB_RUN_ID}")"
          authority="$(printf '%s\n' "$issue" | sed -n 's/^Native authority: //p')"
          token="$(printf '%s\n' "$issue" | sed -n 's/^ONE-TIME BOOTSTRAP TOKEN: //p')"
          test -n "$authority" && test -n "$token"
          password="$(openssl rand -base64 36)Aa1!"
          printf '%s\n%s\n%s\n' "$token" "$password" "$password" | ${compose[@]} run --rm -T -e REQUEST_ENGINE_BOOTSTRAP_DSN="$bootstrap_dsn" api request-engine-platform-bootstrap establish --login ci-platform-controller
          echo "REQUEST_ENGINE_NATIVE_IDENTITY_AUTHORITY_ID=$authority" >> "$GITHUB_ENV"
      - name: Start HTTP surfaces
        run: docker compose -f deploy/reference/compose.e2e.yaml up -d api control-plane
      - name: Wait for readiness
        run: scripts/ci/wait_for_stack.sh
      - name: Verify TCP health surfaces
        run: |
          curl --fail --show-error http://127.0.0.1:58000/health/live
          curl --fail --show-error http://127.0.0.1:58000/health/ready
          curl --fail --show-error http://127.0.0.1:58001/health/live
          curl --fail --show-error http://127.0.0.1:58001/health/ready
      - name: Collect container evidence
        if: always()
        run: scripts/ci/collect_stack_logs.sh .ci/docker-e2e/logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-e2e-logs-${{ github.run_id }}
          path: .ci/docker-e2e/
          if-no-files-found: error
      - name: Tear down
        if: always()
        run: docker compose -f deploy/reference/compose.e2e.yaml down -v --remove-orphans
