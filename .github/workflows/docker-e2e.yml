name: Docker E2E
on:
  pull_request:
    branches: [development]
  workflow_dispatch:
concurrency:
  group: docker-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docker-reference-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    env:
      REQUEST_ENGINE_IMAGE_TAG: ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - name: Prepare evidence workspace
        run: mkdir -p .ci/docker-e2e/phases
      - id: build
        name: Build one Request Engine image
        shell: bash
        run: |
          set -o pipefail
          docker compose -f deploy/reference/compose.e2e.yaml build api 2>&1 | tee .ci/docker-e2e/phases/build.log
          docker image inspect "request-engine:${REQUEST_ENGINE_IMAGE_TAG}" > .ci/docker-e2e/request-engine-image.json
      - id: infra
        name: Start infrastructure
        shell: bash
        run: |
          set -o pipefail
          docker compose -f deploy/reference/compose.e2e.yaml up -d postgres vault mailpit 2>&1 | tee .ci/docker-e2e/phases/infrastructure.log
      - id: migrate
        name: Migrate and provision runtime logins
        shell: bash
        run: |
          set -euo pipefail
          {
            docker compose -f deploy/reference/compose.e2e.yaml run --rm --no-deps migrate
            docker compose -f deploy/reference/compose.e2e.yaml exec -T -e PGPASSWORD=ci-postgres-only postgres \
              psql -U postgres -d request_engine < deploy/reference/init-runtime-roles.sql
          } 2>&1 | tee .ci/docker-e2e/phases/migrate.log
      - id: bootstrap
        name: Bootstrap native trust root through CLI
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee .ci/docker-e2e/phases/bootstrap.log) 2>&1
          compose=(docker compose -f deploy/reference/compose.e2e.yaml)
          bootstrap_dsn='postgresql://postgres:ci-postgres-only@postgres:5432/request_engine'
          issue="$(${compose[@]} run --rm --no-deps -e REQUEST_ENGINE_BOOTSTRAP_DSN="$bootstrap_dsn" api request-engine-platform-bootstrap issue --provenance "github-actions:${GITHUB_RUN_ID}")"
          authority="$(printf '%s\n' "$issue" | sed -n 's/^Native authority: //p')"
          token="$(printf '%s\n' "$issue" | sed -n 's/^ONE-TIME BOOTSTRAP TOKEN: //p')"
          test -n "$authority" && test -n "$token"
          password="$(openssl rand -base64 36)Aa1!"
          printf '%s\n%s\n%s\n' "$token" "$password" "$password" | ${compose[@]} run --rm --no-deps -T -e REQUEST_ENGINE_BOOTSTRAP_DSN="$bootstrap_dsn" api request-engine-platform-bootstrap establish --login ci-platform-controller
          echo "REQUEST_ENGINE_NATIVE_IDENTITY_AUTHORITY_ID=$authority" >> "$GITHUB_ENV"
          echo 'bootstrap completed; sensitive material intentionally omitted'
      - id: start
        name: Start Request Engine HTTP surfaces
        shell: bash
        run: |
          set -o pipefail
          docker compose -f deploy/reference/compose.e2e.yaml up -d --no-build api control-plane 2>&1 | tee .ci/docker-e2e/phases/http-start.log
      - id: ready
        name: Wait for readiness
        shell: bash
        run: |
          set -o pipefail
          bash scripts/ci/wait_for_stack.sh 2>&1 | tee .ci/docker-e2e/phases/readiness.log
      - id: image_identity
        name: Prove one Request Engine artifact
        shell: bash
        run: bash scripts/ci/assert_reference_image_identity.sh 2>&1 | tee .ci/docker-e2e/phases/image-identity.log
      - id: tcp
        name: Verify TCP health surfaces
        shell: bash
        run: |
          set -o pipefail
          {
            curl --fail --silent --show-error http://127.0.0.1:58000/health/live
            curl --fail --silent --show-error http://127.0.0.1:58000/health/ready
            curl --fail --silent --show-error http://127.0.0.1:58001/health/live
            curl --fail --silent --show-error http://127.0.0.1:58001/health/ready
          } 2>&1 | tee .ci/docker-e2e/phases/tcp-smoke.log
      - name: Collect container evidence
        if: always()
        run: bash scripts/ci/collect_stack_logs.sh .ci/docker-e2e
      - name: Write run summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Docker E2E evidence'
            echo
            echo '| Phase | Result |'
            echo '|---|---|'
            echo '| Single image build | ${{ steps.build.outcome }} |'
            echo '| Infrastructure | ${{ steps.infra.outcome }} |'
            echo '| Migration/runtime logins | ${{ steps.migrate.outcome }} |'
            echo '| Bootstrap | ${{ steps.bootstrap.outcome }} |'
            echo '| HTTP startup | ${{ steps.start.outcome }} |'
            echo '| Readiness | ${{ steps.ready.outcome }} |'
            echo '| Image identity | ${{ steps.image_identity.outcome }} |'
            echo '| TCP smoke | ${{ steps.tcp.outcome }} |'
            echo
            echo "Request Engine image: \`request-engine:${REQUEST_ENGINE_IMAGE_TAG}\`"
            echo "Commit: \`${GITHUB_SHA}\` · Run: \`${GITHUB_RUN_ID}\` attempt \`${GITHUB_RUN_ATTEMPT}\`"
            echo
            echo '> Scope: plumbing evidence only; this does not certify production delivery, Vault HA/policies, external TLS, restore-fencing, break-glass, RPO/RTO, or SLOs.'
          } | tee .ci/docker-e2e/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-e2e-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci/docker-e2e/
          if-no-files-found: error
          retention-days: 14
      - name: Tear down
        if: always()
        run: docker compose -f deploy/reference/compose.e2e.yaml down -v --remove-orphans
