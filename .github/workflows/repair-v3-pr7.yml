name: Repair V3 PR7 typing

on:
  push:
    branches: [architecture/v3-postgres-candidate]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply exact typing repair
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path("tests/db/test_v3_candidate.py"),
              Path("tests/db/test_v3_platform.py"),
          ]
          for path in paths:
              text = path.read_text()
              old_import = "from typing import Any, cast"
              old_annotation = "    sql: str,\n"
              if text.count(old_import) != 1:
                  raise SystemExit(f"unexpected typing import count in {path}")
              if text.count(old_annotation) != 1:
                  raise SystemExit(f"unexpected sql annotation count in {path}")
              text = text.replace(
                  old_import,
                  "from typing import Any, LiteralString, cast",
              )
              text = text.replace(old_annotation, "    sql: LiteralString,\n")
              path.write_text(text)
          PY
      - name: Commit repair
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/db/test_v3_candidate.py tests/db/test_v3_platform.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: satisfy psycopg strict query typing"
          git push origin HEAD:architecture/v3-postgres-candidate
