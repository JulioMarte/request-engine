name: Phase 2B correctness repair

on:
  push:
    branches: [phase-2b-slot-offers]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Resolve development environment
        run: uv sync --all-groups
      - name: Prevent re-offering same opportunity to same candidate
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/request_engine/modules/queue/adapters/db/slot_offer_commands.py")
          lines = path.read_text(encoding="utf-8").splitlines()
          marker = "                          FROM request_engine.slot_offers active_offer"
          marker_index = lines.index(marker)
          block_start = marker_index - 2
          prior_block = [
              "                      AND NOT EXISTS (",
              "                          SELECT 1",
              "                          FROM request_engine.slot_offers prior_offer",
              "                          WHERE prior_offer.organization_id = w.organization_id",
              "                            AND prior_offer.slot_opportunity_id = :slot_opportunity_id",
              "                            AND prior_offer.waitlist_entry_id = w.id",
              "                      )",
          ]
          if "                          FROM request_engine.slot_offers prior_offer" not in lines:
              lines[block_start:block_start] = prior_block
          bind_marker = '                    "start_at": opportunity["start_at"],'
          bind_index = lines.index(bind_marker)
          bind_line = '                    "slot_opportunity_id": opportunity["id"],'
          if bind_line not in lines:
              lines.insert(bind_index + 1, bind_line)
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          uv run ruff check . --fix
          uv run ruff format .
          uv run ruff check .
          uv run pyright
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Prevent repeated SlotOffer candidate selection"
          git push origin HEAD:phase-2b-slot-offers
