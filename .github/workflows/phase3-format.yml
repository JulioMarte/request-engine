name: Phase 3 format

on:
  push:
    branches: [phase-3-reservation-lifecycle]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase-3-reservation-lifecycle
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Resolve environment
        run: uv sync --all-groups
      - name: Normalize Ruff lint and format
        run: |
          uv run ruff check --fix .
          uv run ruff format .
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add .
            git commit -m "Normalize Phase 3 formatting"
            git push origin HEAD:phase-3-reservation-lifecycle
          fi
