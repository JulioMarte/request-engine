name: Phase 3 format

on:
  push:
    branches: [phase-3-reservation-lifecycle]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase-3-reservation-lifecycle
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Resolve environment
        run: uv sync --all-groups
      - name: Normalize Phase 3 typing
        run: |
          python - <<'PY'
          from pathlib import Path

          attendance = Path("src/request_engine/modules/booking/adapters/db/attendance_commands.py")
          text = attendance.read_text(encoding="utf-8")
          text = text.replace(
              "from sqlalchemy.engine import RowMapping\n",
              "from sqlalchemy.engine import RowMapping\nfrom sqlalchemy.ext.asyncio import AsyncSession\n",
          )
          text = text.replace("session: object", "session: AsyncSession")
          text = text.replace(
              "await cast(object, session).execute(  # type: ignore[attr-defined]",
              "await session.execute(",
          )
          attendance.write_text(text, encoding="utf-8")

          communications = Path(
              "src/request_engine/modules/communications/adapters/db/reservation_lifecycle_intent.py"
          )
          text = communications.read_text(encoding="utf-8")
          text = text.replace(
              "    context = {\n",
              "    context: dict[str, object] = {\n",
          )
          communications.write_text(text, encoding="utf-8")
          PY
      - name: Normalize Ruff lint and format
        run: |
          uv run ruff check --fix . || true
          uv run ruff format .
          uv run ruff check --fix . || true
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add .
            git commit -m "Normalize Phase 3 typing and formatting"
            git push origin HEAD:phase-3-reservation-lifecycle
          fi
