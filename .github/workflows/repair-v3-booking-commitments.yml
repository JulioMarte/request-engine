name: Repair V3 booking commitments

on:
  push:
    branches: [feature/v3-booking-commitments]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Apply exact semantic repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/request_engine/modules/booking/adapters/db/commitment_commands.py")
          text = path.read_text()

          replacements = [
              (
                  "from request_engine.modules.booking.adapters.db.reservation_commands import (\n    _load_bookable_offering,",
                  "from request_engine.modules.booking.adapters.db.reservation_commands import (\n    _LockedResource,\n    _load_bookable_offering,",
              ),
              (
                  "    CapacityHoldNotFound,\n    ReservationNotFound,",
                  "    CapacityHoldNotFound,\n    InvalidHoldExpiration,\n    ReservationNotFound,",
              ),
              (
                  "            if expires_at <= now:\n                raise CapacityHoldExpired(UUID(int=0))",
                  "            if expires_at <= now:\n                raise InvalidHoldExpiration()",
              ),
              (
                  "               status, expires_at, revision\n",
                  "               status, expires_at, revision, clock_timestamp() AS db_now\n",
              ),
              (
                  '    if cast(datetime, row["expires_at"]) <= datetime.now().astimezone():\n',
                  '    if cast(datetime, row["expires_at"]) <= cast(datetime, row["db_now"]):\n',
              ),
              (
                  "    resources: dict[UUID, object],\n",
                  "    resources: dict[UUID, _LockedResource],\n",
              ),
              (
                  '        capacity_model = getattr(resource, "capacity_model")\n        capacity_units = getattr(resource, "capacity_units")\n        default_timezone = getattr(resource, "default_timezone")\n        profiles[resource_id] = ResourceAvailability(\n            capacity_model=capacity_model,\n            capacity_units=capacity_units,\n            default_timezone=default_timezone,\n',
                  '        profiles[resource_id] = ResourceAvailability(\n            capacity_model=resource.capacity_model,\n            capacity_units=resource.capacity_units,\n            default_timezone=resource.default_timezone,\n',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"unexpected replacement count for: {old[:80]!r}")
              text = text.replace(old, new)

          old = '''            old_by_requirement = {\n                cast(UUID, row["requirement_id"]): cast(UUID, row["id"]) for row in old_claims\n            }\n            replacement_ids: dict[UUID, UUID] = {}\n'''
          new = '''            old_by_requirement = {\n                cast(UUID, row["requirement_id"]): cast(UUID, row["id"]) for row in old_claims\n            }\n            if set(old_by_requirement) != set(requirements):\n                raise BookingConfigurationError(\n                    f"Reservation {command.reservation_id} does not have the canonical claim set"\n                )\n            replacement_ids: dict[UUID, UUID] = {}\n'''
          if text.count(old) != 1:
              raise SystemExit("unexpected old claim mapping")
          text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check 'ruff>=0.15.22,<0.16'
      - name: Canonicalize formatting
        run: |
          ruff format .
          ruff check --fix .
          ruff format .
          ruff check .
      - name: Commit repair
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: harden booking commitment semantics"
          git push origin HEAD:feature/v3-booking-commitments
