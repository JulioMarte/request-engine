name: Temporary F1 lint fix

on:
  push:
    branches:
      - feature/operational-profile-contextual-supply

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[f1-lint-fix]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply the two remaining Ruff-safe rewrites
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("src/request_engine/modules/booking/adapters/db/contextual_config_commands.py"): (
                  """    if currency is not None:\n        if len(currency) != 3 or not currency.isalpha() or currency != currency.upper():\n            raise ValueError(\"currency must be an uppercase three-letter code\")\n""",
                  """    if currency is not None and (\n        len(currency) != 3 or not currency.isalpha() or currency != currency.upper()\n    ):\n        raise ValueError(\"currency must be an uppercase three-letter code\")\n""",
              ),
              Path("tests/integration/f1_operational_profile/test_schema.py"): (
                  """    with pytest.raises(psycopg.errors.CheckViolation):\n        with admin_conn.transaction():\n""",
                  """    with pytest.raises(psycopg.errors.CheckViolation), admin_conn.transaction():\n""",
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected lint pattern not found in {path}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit exact lint rewrites
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/request_engine/modules/booking/adapters/db/contextual_config_commands.py \
            tests/integration/f1_operational_profile/test_schema.py
          git commit -m "style: close remaining F1 Ruff findings [f1-lint-fix]"
          git push origin HEAD:feature/operational-profile-contextual-supply
