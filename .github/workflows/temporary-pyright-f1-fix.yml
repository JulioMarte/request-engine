name: Temporary F1 Pyright fix

on:
  push:
    branches:
      - feature/operational-profile-contextual-supply

permissions:
  contents: write
  statuses: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[pyright-f1-fix]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Publish fixer pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"Request Engine / F1 fixer\",\"description\":\"Applying strict typing fixes\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --all-groups

      - name: Apply exact strict-typing rewrites
        run: |
          python - <<'PY'
          from pathlib import Path

          def rewrite(path: Path, replacements: tuple[tuple[str, str], ...]) -> None:
              text = path.read_text(encoding="utf-8")
              original = text
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(
                          f"expected exactly one pattern in {path}, found {count}: {old[:100]!r}"
                      )
                  text = text.replace(old, new, 1)
              if text == original:
                  raise SystemExit(f"no changes produced for {path}")
              path.write_text(text, encoding="utf-8")
              print(f"rewrote {path}")

          availability = Path(
              "src/request_engine/modules/booking/adapters/db/appointment_availability_reader.py"
          )
          rewrite(
              availability,
              (
                  (
                      "    ConflictingContextualTerms,\n    ContextNotBookable,\n",
                      "    ConflictingContextualTerms,\n    ContextBookingTerms,\n    ContextNotBookable,\n",
                  ),
                  (
                      '''        resource_id = cast(UUID, row["resource_id"])\n        common = {\n            "requirement_id": cast(UUID, row["requirement_id"]),\n            "ordinal": cast(int, row["ordinal"]),\n            "quantity": cast(int, row["quantity"]),\n            "resource_id": resource_id,\n            "legacy_location_id": cast(UUID | None, row["location_id"]),\n            "availability_revision": cast(int, row["availability_revision"]),\n        }\n''',
                      '''        requirement_id = cast(UUID, row["requirement_id"])\n        ordinal = cast(int, row["ordinal"])\n        quantity = cast(int, row["quantity"])\n        resource_id = cast(UUID, row["resource_id"])\n        legacy_location_id = cast(UUID | None, row["location_id"])\n        availability_revision = cast(int, row["availability_revision"])\n''',
                  ),
                  (
                      "                        **common,\n",
                      """                        requirement_id=requirement_id,\n                        ordinal=ordinal,\n                        quantity=quantity,\n                        resource_id=resource_id,\n                        legacy_location_id=legacy_location_id,\n                        availability_revision=availability_revision,\n""",
                  ),
                  (
                      "                **common,\n",
                      """                requirement_id=requirement_id,\n                ordinal=ordinal,\n                quantity=quantity,\n                resource_id=resource_id,\n                legacy_location_id=legacy_location_id,\n                availability_revision=availability_revision,\n""",
                  ),
                  (
                      "    context_observations = []\n",
                      "    context_observations: list[ContextBookingTerms | None] = []\n",
                  ),
                  (
                      "    context_observations: tuple[object, ...],\n",
                      "    context_observations: tuple[ContextBookingTerms | None, ...],\n",
                  ),
                  (
                      '''    contexts = []\n    for observation in context_observations:\n        if observation is None:\n            contexts.append(None)\n        else:\n            typed = cast(object, observation)\n            from request_engine.modules.booking.domain.contextual_supply import ContextBookingTerms\n\n            value = cast(ContextBookingTerms, typed)\n            contexts.append({"id": str(value.id), "revision": value.revision})\n''',
                      '''    contexts: list[dict[str, object] | None] = []\n    for observation in context_observations:\n        if observation is None:\n            contexts.append(None)\n        else:\n            contexts.append({"id": str(observation.id), "revision": observation.revision})\n''',
                  ),
              ),
          )

          reservation = Path(
              "src/request_engine/modules/booking/adapters/db/contextual_reservation_commands.py"
          )
          rewrite(
              reservation,
              (
                  (
                      '''class _RequirementLike(Protocol):\n    id: UUID\n    ordinal: int\n''',
                      '''class _RequirementLike(Protocol):\n    @property\n    def id(self) -> UUID: ...\n\n    @property\n    def ordinal(self) -> int: ...\n''',
                  ),
                  (
                      '''                "assignment_id": (\n                    str(selected_assignments[requirement_id].id)\n                    if selected_assignments[requirement_id] is not None\n                    else None\n                ),\n                "assignment_revision": (\n                    selected_assignments[requirement_id].revision\n                    if selected_assignments[requirement_id] is not None\n                    else None\n                ),\n''',
                      '''                "assignment_id": _assignment_id(\n                    selected_assignments[requirement_id]\n                ),\n                "assignment_revision": _assignment_revision(\n                    selected_assignments[requirement_id]\n                ),\n''',
                  ),
                  (
                      '''def _legacy_location_value(resource: LockedResource) -> str | None:\n''',
                      '''def _assignment_id(assignment: AssignmentObservation | None) -> str | None:\n    return str(assignment.id) if assignment is not None else None\n\n\ndef _assignment_revision(assignment: AssignmentObservation | None) -> int | None:\n    return assignment.revision if assignment is not None else None\n\n\ndef _legacy_location_value(resource: LockedResource) -> str | None:\n''',
                  ),
              ),
          )

          business = Path(
              "src/request_engine/modules/catalog/adapters/db/business_info_reader.py"
          )
          rewrite(
              business,
              (
                  (
                      "from collections import defaultdict\n",
                      "from collections import defaultdict\nfrom collections.abc import Sequence\n",
                  ),
                  (
                      "from sqlalchemy import text\n",
                      "from sqlalchemy import text\nfrom sqlalchemy.engine import RowMapping\n",
                  ),
                  (
                      '''    location_contact_rows = []\n    hours_rows = []\n    exception_rows = []\n''',
                      '''    location_contact_rows: Sequence[RowMapping] = ()\n    hours_rows: Sequence[RowMapping] = ()\n    exception_rows: Sequence[RowMapping] = ()\n''',
                  ),
              ),
          )
          PY

      - name: Canonical lint and format
        run: |
          uv run ruff check --fix \
            src/request_engine/modules/booking/adapters/db/appointment_availability_reader.py \
            src/request_engine/modules/booking/adapters/db/contextual_reservation_commands.py \
            src/request_engine/modules/catalog/adapters/db/business_info_reader.py
          uv run ruff format \
            src/request_engine/modules/booking/adapters/db/appointment_availability_reader.py \
            src/request_engine/modules/booking/adapters/db/contextual_reservation_commands.py \
            src/request_engine/modules/catalog/adapters/db/business_info_reader.py
          uv run ruff check \
            src/request_engine/modules/booking/adapters/db/appointment_availability_reader.py \
            src/request_engine/modules/booking/adapters/db/contextual_reservation_commands.py \
            src/request_engine/modules/catalog/adapters/db/business_info_reader.py

      - name: Prove strict typing before publish
        run: uv run pyright

      - name: Commit strict-typing fixes
        run: |
          if git diff --quiet; then
            echo "No source changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/request_engine/modules/booking/adapters/db/appointment_availability_reader.py \
            src/request_engine/modules/booking/adapters/db/contextual_reservation_commands.py \
            src/request_engine/modules/catalog/adapters/db/business_info_reader.py
          git commit -m "fix: make F1 contextual paths strict-type-safe [pyright-f1-fix]"
          git push origin HEAD:feature/operational-profile-contextual-supply

      - name: Publish fixer final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "${JOB_STATUS}" = "success" ]; then
            STATE=success
            DESCRIPTION="Strict typing fixes published"
          else
            STATE=failure
            DESCRIPTION="Strict typing fixer failed"
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${STATE}\",\"context\":\"Request Engine / F1 fixer\",\"description\":\"${DESCRIPTION}\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
