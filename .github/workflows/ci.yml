name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-quality:
    name: Python quality and architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Resolve development environment
        run: uv sync --all-groups
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --diff .
      - name: Pyright
        run: uv run pyright
      - name: Architecture tests
        run: uv run pytest tests/architecture -q

  postgres-v2-history:
    name: PostgreSQL 18 V2 design history
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: request_engine
          POSTGRES_USER: request_engine
          POSTGRES_PASSWORD: request_engine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U request_engine -d request_engine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: request_engine
      PGUSER: request_engine
      PGPASSWORD: request_engine
    steps:
      - uses: actions/checkout@v6
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Apply historical V2 design chain
        run: scripts/db/apply_design_chain.sh

  postgres-v3-candidate:
    name: PostgreSQL 18 V3 candidate and races
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: request_engine_v3
          POSTGRES_USER: request_engine
          POSTGRES_PASSWORD: request_engine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U request_engine -d request_engine_v3"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: request_engine_v3
      PGUSER: request_engine
      PGPASSWORD: request_engine
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv and PostgreSQL client
        run: |
          python -m pip install --disable-pip-version-check uv
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Apply clean V3 candidate
        run: bash scripts/db/apply_v3_candidate.sh
      - name: Resolve test environment
        run: uv sync --all-groups
      - name: V3 PostgreSQL invariant and race tests
        run: uv run pytest tests/db -q -m postgres
