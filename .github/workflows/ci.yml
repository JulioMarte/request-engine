name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-quality:
    name: Python quality and architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Resolve development environment
        run: uv sync --all-groups
      - name: Lockfile consistency
        run: uv lock --check
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --diff .
      - name: Pyright
        run: uv run pyright
      - name: High-confidence secret scan
        run: uv run python scripts/release/scan_v3_secrets.py
      - name: Architecture tests
        run: uv run pytest tests/architecture -q
      - name: Module unit tests
        run: uv run pytest tests/modules -q

  postgres-v2-history:
    name: PostgreSQL 18 V2 design history
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: request_engine
          POSTGRES_USER: request_engine
          POSTGRES_PASSWORD: request_engine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U request_engine -d request_engine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: request_engine
      PGPASSWORD: request_engine
    steps:
      - uses: actions/checkout@v6
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Apply historical V2 design chain
        env:
          PGDATABASE: request_engine
        run: scripts/db/apply_design_chain.sh

  postgres-v3-bootstrap-proof:
    name: PostgreSQL 18 V3 repeated bootstrap proof
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: request_engine_v3
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d request_engine_v3"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGMAINTENANCE_DB: postgres
      V3_PROOF_DATABASE_PREFIX: request_engine_v3_phase6
    steps:
      - uses: actions/checkout@v6
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Prove repeated clean V3 candidate bootstrap
        run: scripts/db/prove_v3_candidate_bootstrap.sh

  postgres-v3-candidate:
    name: PostgreSQL 18 V3 candidate and verticals
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: request_engine_v3
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d request_engine_v3"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: request_engine_v3
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv and PostgreSQL client
        run: |
          python -m pip install --disable-pip-version-check uv
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Apply clean V3 candidate as bootstrap principal
        run: bash scripts/db/apply_v3_candidate.sh
      - name: Resolve test environment
        run: uv sync --all-groups
      - name: Generate V3 schema fingerprint
        run: |
          mkdir -p .phase6
          uv run python scripts/db/v3_schema_fingerprint.py \
            --json-output .phase6/v3-schema.json \
            --sha-output .phase6/v3-schema.sha256
          cat .phase6/v3-schema.sha256
      - name: Audit V3 PostgreSQL catalog
        run: >-
          uv run python scripts/db/audit_v3_catalog.py
          --json-output .phase6/v3-catalog-audit.json
      - name: Prove measured worker query plans
        run: >-
          uv run python scripts/release/prove_v3_worker_query_plans.py
          --output .phase6/v3-worker-query-plans.json
      - name: Generate and prove 0001 initial candidate equivalence
        run: |
          uv run python scripts/db/build_v3_initial_candidate.py \
            --output .phase6/0001_initial.candidate.sql
          uv run bash scripts/db/prove_v3_initial_equivalence.sh \
            | tee .phase6/v3-initial-equivalence.txt
      - name: V3 PostgreSQL invariant, race, and vertical tests
        run: >-
          uv run pytest
          tests/db
          tests/integration/v3_first_vertical
          tests/integration/v3_booking_core
          tests/integration/v3_booking_commitments
          tests/integration/v3_slot_offer_recovery
          tests/integration/v3_reservation_lifecycle
          tests/integration/v3_worker_runtime
          -q
          -m postgres
      - name: Generate executable release evidence manifest
        if: always()
        env:
          PHASE6_COMMIT_SHA: ${{ github.sha }}
        run: >-
          uv run python scripts/release/build_v3_evidence_manifest.py
          --output .phase6/v3-evidence-manifest.json
      - name: Upload V3 candidate release proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-candidate-release-proof
          path: .phase6/
          include-hidden-files: true
          if-no-files-found: warn
