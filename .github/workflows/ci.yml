name: CI

on:
  pull_request:
  push:
    # F1 is under active pre-PR implementation. Keep this branch-specific so
    # development can obtain real CI evidence without enabling push CI for every
    # feature branch. Remove this entry before merge; PR CI remains canonical.
    branches:
      - main
      - feature/operational-profile-contextual-supply
  workflow_dispatch:

permissions:
  contents: read

# A PR can receive several commits while an implementation is in progress.
# Only the newest revision has evidentiary value, so cancel obsolete runs instead
# of consuming runners and external service/API quotas for stale commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.5"

jobs:
  python-quality:
    name: Python quality and architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install and cache uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Run canonical Python quality job
        run: >-
          python scripts/ci/ci_jobs.py python-quality
          --summary-output .ci/python-quality.json
          --log-dir .ci/logs
      - name: Upload Python quality failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: python-quality-failure-summary
          path: .ci/
          include-hidden-files: true
          if-no-files-found: warn

  observability-contract:
    name: Observability runtime contract
    needs: python-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install and cache uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            deploy/observability/requirements.txt
      - name: Install project and pinned OpenTelemetry runtime
        run: |
          uv sync --frozen --no-dev
          uv pip install -r deploy/observability/requirements.txt
      - name: Validate zero-code launcher
        run: >-
          uv run --no-sync python scripts/observability/run_with_otel.py
          --service-name request-engine-ci --check
      - name: Run OpenTelemetry compatibility, SDK, and exporter smoke test
        run: uv run --no-sync python scripts/observability/smoke_otel.py

  postgres-v2-history:
    name: PostgreSQL 18 V2 design history
    needs: python-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: request_engine
          POSTGRES_USER: request_engine
          POSTGRES_PASSWORD: request_engine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U request_engine -d request_engine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: request_engine
      PGPASSWORD: request_engine
      PGDATABASE: request_engine
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify preinstalled PostgreSQL client
        run: psql --version
      - name: Run canonical V2 history job
        run: python scripts/ci/ci_jobs.py postgres-v2-history

  postgres-v3-bootstrap-proof:
    name: PostgreSQL 18 V3 repeated bootstrap proof
    needs: python-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: request_engine_v3
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d request_engine_v3"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGMAINTENANCE_DB: postgres
      V3_PROOF_DATABASE_PREFIX: request_engine_v3_phase6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify preinstalled PostgreSQL client
        run: psql --version
      - name: Run canonical V3 bootstrap proof job
        run: python scripts/ci/ci_jobs.py postgres-v3-bootstrap-proof

  # V3 G17-G20 and the exact public-contract freeze are immutable release
  # evidence bound to the released V3 source. Post-baseline branches must not
  # regenerate or rewrite that evidence. Instead, run current code against the
  # frozen candidate to prove backward compatibility.
  postgres-v3-candidate-proof:
    name: PostgreSQL 18 frozen V3 compatibility
    needs:
      - python-quality
      - observability-contract
      - postgres-v3-bootstrap-proof
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: request_engine_v3
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d request_engine_v3"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: request_engine_v3
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install and cache uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Verify preinstalled PostgreSQL client
        run: psql --version
      - name: Run frozen V3 release compatibility proof
        run: bash scripts/ci/run_v3_candidate_with_g19.sh
      - name: Upload frozen V3 compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-candidate-release-proof
          path: .phase6/
          include-hidden-files: true
          if-no-files-found: warn

  # This is the active post-baseline product gate. It proves append-only Alembic
  # evolution, F1 schema/runtime behavior, semantic configuration authority,
  # stale-option protection, commercial provenance, and V3 booking regression.
  postgres-production-head:
    name: PostgreSQL 18 F1 operational profile and contextual supply
    needs: python-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: request_engine_f1
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d request_engine_f1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: request_engine_f1
      PGUSER: postgres
      PGPASSWORD: postgres
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/request_engine_f1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install and cache uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Verify preinstalled PostgreSQL client
        run: psql --version
      - name: Run canonical F1 operational profile proof
        run: bash scripts/ci/run_f1_operational_profile.sh
      - name: Upload F1 proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-operational-profile-proof
          path: .ci/f1-operational-profile/
          include-hidden-files: true
          if-no-files-found: warn

  # This exact job name is ruleset-required. Keep the expensive PostgreSQL proof
  # conditional, then always run this lightweight aggregate so a failed/skipped
  # prerequisite can never become a non-blocking skipped required check.
  postgres-v3-candidate:
    name: PostgreSQL 18 V3 candidate and verticals
    needs:
      - python-quality
      - observability-contract
      - postgres-v3-bootstrap-proof
      - postgres-v3-candidate-proof
      - postgres-production-head
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      statuses: write
    env:
      REQUIRED_NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v6
      - name: Require successful prerequisite jobs
        id: aggregate
        run: python scripts/ci/require_successful_needs.py
      - name: Publish connector-readable aggregate status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          AGGREGATE_OUTCOME: ${{ steps.aggregate.outcome }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "$AGGREGATE_OUTCOME" == "success" ]]; then
            state=success
            description="all required Request Engine CI jobs passed"
          else
            state=failure
            description="one or more required Request Engine CI jobs failed"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="Request Engine / CI aggregate" \
            -f description="$description" \
            -f target_url="$TARGET_URL"
