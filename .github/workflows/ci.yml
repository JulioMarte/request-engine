name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-quality:
    name: Python quality and architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Resolve development environment
        run: uv sync --all-groups
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Pyright
        run: uv run pyright
      - name: Architecture tests
        run: uv run pytest tests/architecture -q

  postgres-design-chain:
    name: PostgreSQL 18 design chain
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: request_engine
          POSTGRES_USER: request_engine
          POSTGRES_PASSWORD: request_engine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U request_engine -d request_engine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: request_engine
      PGUSER: request_engine
      PGPASSWORD: request_engine
    steps:
      - uses: actions/checkout@v6
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Apply current design chain
        run: scripts/db/apply_design_chain.sh
