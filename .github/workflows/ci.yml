name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A PR can receive several commits while an implementation is in progress.
# Only the newest revision has evidentiary value, so cancel obsolete runs instead
# of consuming runners and external service/API quotas for stale commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python quality and architecture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.5
      - name: Run canonical Python quality job
        run: python scripts/ci/ci_jobs.py python-quality

  observability-contract:
    name: Observability runtime contract
    needs: python-quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install project and pinned OpenTelemetry runtime
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.5
          uv sync --frozen --no-dev
          uv pip install -r deploy/observability/requirements.txt
      - name: Validate zero-code launcher
        run: >-
          uv run --no-sync python scripts/observability/run_with_otel.py
          --service-name request-engine-ci --check
      - name: Run OpenTelemetry compatibility, SDK, and exporter smoke test
        run: uv run --no-sync python scripts/observability/smoke_otel.py

  postgres-v2-history:
    name: PostgreSQL 18 V2 design history
    needs: python-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: request_engine
          POSTGRES_USER: request_engine
          POSTGRES_PASSWORD: request_engine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U request_engine -d request_engine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: request_engine
      PGPASSWORD: request_engine
      PGDATABASE: request_engine
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Run canonical V2 history job
        run: python scripts/ci/ci_jobs.py postgres-v2-history

  postgres-v3-bootstrap-proof:
    name: PostgreSQL 18 V3 repeated bootstrap proof
    needs: python-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: request_engine_v3
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d request_engine_v3"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGMAINTENANCE_DB: postgres
      V3_PROOF_DATABASE_PREFIX: request_engine_v3_phase6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Run canonical V3 bootstrap proof job
        run: python scripts/ci/ci_jobs.py postgres-v3-bootstrap-proof

  postgres-v3-candidate:
    name: PostgreSQL 18 V3 candidate and verticals
    needs:
      - python-quality
      - observability-contract
      - postgres-v3-bootstrap-proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: request_engine_v3
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d request_engine_v3"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: request_engine_v3
      PGUSER: postgres
      PGPASSWORD: postgres
      PHASE6_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv and PostgreSQL client
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.5
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Run canonical V3 candidate job
        run: python scripts/ci/ci_jobs.py postgres-v3-candidate
      - name: Upload V3 candidate release proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-candidate-release-proof
          path: .phase6/
          include-hidden-files: true
          if-no-files-found: warn
