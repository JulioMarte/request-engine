name: CI

on:
  pull_request:
  push:
    # Feature branches are validated by pull_request CI. Direct push CI covers
    # the integrated states themselves: main (release) and development (the
    # canonical integration branch), so every merged development SHA carries
    # its own canonical run, not only the PR head that produced it.
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: read

# A PR can receive several commits while an implementation is in progress.
# Only the newest revision has evidentiary value, so cancel obsolete runs instead
# of consuming runners and external service/API quotas for stale commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.5"

jobs:
  python-quality:
    name: Python quality and architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QUALITY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
      QUALITY_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      QUALITY_TEST_MODE: ${{ github.event_name == 'pull_request' && 'PR_INTEGRATION_CANDIDATE' || 'BRANCH_HEAD' }}
      FILE_BUDGET_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
      QUALITY_POLICY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install and cache uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Build repository engineering-quality baseline
        run: >-
          uv run python scripts/ci/build_engineering_quality_baseline.py
          --output .ci/engineering-quality-baseline.json
      - name: Build architecture diff evidence
        run: >-
          uv run python scripts/ci/build_architecture_diff.py
          --base-ref "$QUALITY_BASE_REF"
          --output .ci/architecture-diff.json
      - name: Run canonical Python quality job
        run: >-
          python scripts/ci/ci_jobs.py python-quality
          --summary-output .ci/python-quality.json
          --log-dir .ci/logs
      - name: Enforce quality-policy separation
        if: always()
        run: >-
          python scripts/ci/check_quality_policy_separation.py
          --base-ref "$QUALITY_POLICY_BASE_REF"
      - name: Finalize quality evidence packets
        if: always()
        run: >-
          python scripts/ci/finalize_quality_evidence.py
          --scan .ci/python-quality-signals.json
          --baseline .ci/engineering-quality-baseline.json
          --architecture-diff .ci/architecture-diff.json
          --summary .ci/python-quality.json
          --output-dir .ci/quality-evidence
      - name: Validate quality evidence schema
        if: always()
        run: >-
          uv run --with jsonschema==4.25.1
          python scripts/ci/validate_quality_evidence.py
          --schema docs/engineering-quality/schemas/quality-evidence-v2.schema.json
          --packet-dir .ci/quality-evidence
      - name: Summarize semantic review calibration
        if: always()
        run: >-
          python scripts/ci/summarize_quality_calibration.py
          --input docs/engineering-quality/calibration/pilot-observations.v1.json
          --output .ci/calibration/human-model-summary.json
      - name: Inventory test architecture and evidence metadata
        if: always()
        run: >-
          python scripts/ci/audit_test_architecture.py
          --output .ci/test-architecture.json
      - name: Upload Python quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: >-
            python-quality-evidence-source-${{ github.event.pull_request.head.sha || github.sha }}-tested-${{ github.sha }}
          path: .ci/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

  observability-contract:
    name: Observability runtime contract
    needs: python-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install and cache uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            deploy/observability/requirements.txt
      - name: Install project and pinned OpenTelemetry runtime
        run: |
          uv sync --frozen --no-dev
          uv pip install -r deploy/observability/requirements.txt
      - name: Validate zero-code launcher
        run: >-
          uv run --no-sync python scripts/observability/run_with_otel.py
          --service-name request-engine-ci --check
      - name: Run OpenTelemetry compatibility, SDK, and exporter smoke test
        run: uv run --no-sync python scripts/observability/smoke_otel.py

  postgres-v2-history:
    name: PostgreSQL 18 V2 design history
    needs: python-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: request_engine
          POSTGRES_USER: request_engine
          POSTGRES_PASSWORD: request_engine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U request_engine -d request_engine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: request_engine
      PGPASSWORD: request_engine
      PGDATABASE: request_engine
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify preinstalled PostgreSQL client
        run: psql --version
      - name: Run canonical V2 history job
        run: python scripts/ci/ci_jobs.py postgres-v2-history

  postgres-production-head:
    name: PostgreSQL 18 current product proof
    needs: python-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: request_engine_current
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d request_engine_current"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: request_engine_current
      PGUSER: postgres
      PGPASSWORD: postgres
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/request_engine_current
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install and cache uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Verify preinstalled PostgreSQL client
        run: psql --version
      - name: Run canonical current-product proof
        run: bash scripts/ci/run_current_product.sh
      - name: Upload current-product proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-product-proof
          path: .ci/current-product/
          include-hidden-files: true
          if-no-files-found: warn

  postgres-v3-candidate:
    name: PostgreSQL 18 V3 candidate and verticals
    needs:
      - python-quality
      - observability-contract
      - postgres-production-head
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      statuses: write
    env:
      REQUIRED_NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v6
      - name: Require successful prerequisite jobs
        id: aggregate
        run: python scripts/ci/require_successful_needs.py
      - name: Publish connector-readable aggregate status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          AGGREGATE_OUTCOME: ${{ steps.aggregate.outcome }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "$AGGREGATE_OUTCOME" == "success" ]]; then
            state=success
            description="all required Request Engine CI jobs passed"
          else
            state=failure
            description="one or more required Request Engine CI jobs failed"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="Request Engine / CI aggregate" \
            -f description="$description" \
            -f target_url="$TARGET_URL"
